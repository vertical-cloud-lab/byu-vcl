# cub_xl_ben_pipette_capper.yaml -- CubXL, @benwhitney5463's 2026-08-31 rev.
#
# Attached to PR #171 on 2026-08-31 with a body byte-identical to the
# 2026-08-26 rev already on this branch (verified by parsed-YAML diff). The
# ONLY edit is grbl_settings.max_travel_{x,y,z}, synced to the controller --
# see the CHANGED block at those lines. RUN ON HARDWARE 2026-08-31 in this
# exact form: 18/18 steps, 4m 39s, campaign 33, no retries.
#
# ---------------------------------------------------------------------------
# WHY safe_z IS 87.0 AND MUST STAY THERE
# ---------------------------------------------------------------------------
# Engage-based pipette commands (aspirate, blowout, drop_tip, mix) travel at
# safe_z measured AT THE TOOL POINT, and with a 35 mm tip attached the tool
# point is the tip end -- so the carriage must reach safe_z + 35. At 87 that
# is gantry 122, exactly working_volume.z_max. At the old 114 it would be
# 149, 27 mm past the machine's travel, and validate_setup rejects it.
# Engage commands accept no travel_z, so nothing in the protocol or deck can
# route around it. Confirmed on hardware 2026-08-31: the tipped hover before
# aspirate/blowout commanded gantry Z 122.000 and the run completed.
#
# The cost is that safe_z is SHARED with the capper (depth -15.935), so every
# decap/cap leg now rides at gantry 71.065 -- and the pipette is the lowest
# thing on the head, so with a tip on, the tip end sweeps deck Z 36.065,
# 19 mm below the vial rims. That is unfixable vertically at this safe_z,
# which is what park_position is for:
#
# ---------------------------------------------------------------------------
# park_position [206, 50] -- ON the vial column's X, on purpose
# ---------------------------------------------------------------------------
# decap/cap each end with a hardcoded park move at the capper's safe_z, and
# _build_direct_move emits one G01 per changed axis (X, then Y, then Z -- the
# mill never commands simultaneous multi-axis motion). Parking OFF the column
# (the old [125, 50]) gives every leg an X component that walks the passive
# pipette across the cap tops at ~3 mm clearance -- closest pass 0.9 mm from
# vial_2's axis. Parking at the column's own X makes every leg a pure-Y move
# with the pipette held at deck X 258, 52 mm clear of the vials. Verified in
# the 2026-08-31 trace: every capper pose is x=206.000.
#
# Caveat unchanged: the capper then parks over vial_2's footprint at deck
# Z 87. Holding a ~13 mm cap the underside sits near deck 74 vs vial_2's cap
# top at 68 -- about 6 mm, unmeasured. [206, 5] or [206, 220] clears every
# footprint and still sweeps clean, if that looks tight by eye.
#
# ---------------------------------------------------------------------------
# CONTROLLER NOTES
# ---------------------------------------------------------------------------
# $20 (soft limits) was found at 0 on 2026-08-27 -- disabled -- because
# configure_soft_limits_from_spans (gantry.py:618-632) writes $20=0, then the
# travel extents, then $20=1, and an interrupted calibration leaves it off.
# Restored then; verified $20=1 again on 2026-08-31. Re-check after any
# calibration that gets interrupted. $21 (hard limits) is 0 by design.
#
# Both instruments share /dev/ttyACM0 (one Arduino firmware answers both:
# cmd 7 is the capper's line-break sensor, cmd 14 the plunger). At this CubOS
# checkout (cbc33dc) there is no PawduinoLink arbitration -- each driver
# opens its own serial handle. It works in practice (three hardware runs now)
# but it is fragile; updating the Pi past upstream 1a9987f fixes it properly.
#
# The plunger reports max_vol 300.00 while pipette_model says p20_single_gen2.
# Worth settling which pipette is mounted: mm_to_ul 0.025 is the p20 number,
# so volume_ul: 20.0 is 0.5 mm of plunger travel, not 20 microlitres.
serial_port: /dev/ttyUSB0
gantry_type: cub_xl
cnc:
  factory_z_travel_mm: 129.0
  calibration_block_height_mm: 35.0
  y_axis_motion: head
  safe_z: 87.0
working_volume:
  x_min: 0.0
  x_max: 386.333
  y_min: 0.0
  y_max: 232.0
  z_min: 0.0
  z_max: 122.0
origin_policy: deck_origin
grbl_settings:
  dir_invert_mask: 1
  status_report: 0
  soft_limits: true
  homing_enable: true
  homing_dir_mask: 0
  homing_pull_off: 3.0
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  # CHANGED 2026-08-31 from 389.333 / 235.0 / 125.0 to match what the
  # controller actually reports. These three are in the CRITICAL set of
  # Gantry._validate_grbl_settings, compared at 0.001 mm, so until they
  # agreed EVERY hardware run aborted at connect with "Critical GRBL
  # settings mismatch -- motion would be wrong", before any G-code. Read
  # live off the board twice (2026-08-28 and 2026-08-31, identical):
  #   <Alarm|WPos:409.000,309.000,124.000|WCO:-409.000,-309.000,-124.000>
  # working_volume below is deliberately left TIGHTER than these (386.333 /
  # 232 / 122 vs 409 / 309 / 124) -- it is the software envelope the whole
  # protocol geometry was validated against, and shrinking the usable area
  # is the conservative direction.
  max_travel_x: 409.0
  max_travel_y: 309.0
  max_travel_z: 124.0
instruments:
  vial_capper_decapper:
    type: capper
    vendor: pawduino
    offset_x: 0.0
    offset_y: 0.0
    depth: -15.935
    capture_retries: 2
    capture_settle_s: 1
    engage_depth_mm: 13
    offline: false
    park_position:
    - 206
    - 50
    port: /dev/ttyACM0
  pipette:
    type: pipette
    vendor: opentrons
    offset_x: 52.0
    offset_y: 12.0
    depth: 0.0
    pipette_model: p20_single_gen2
    port: /dev/ttyACM0
    offline: false
