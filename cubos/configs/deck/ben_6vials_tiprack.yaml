# ben_6vials_tiprack.yaml -- @benwhitney5463's vial column plus the 2x15 tip
# rack, CubXL, 2026-09-26 rev: the new bench, in the new calibration's frame
# (391 / 236.665 / 124; see the gantry file).
#
# Attached to PR #228 on 2026-09-26. THE BODY BELOW IS BEN'S, VERBATIM (parsed
# YAML verified identical to the attachment) EXCEPT the tip rack's XY, which
# Ben asked to be set from a new jog reading:
#   "I measured these coordinates with the pipette tip hovering over the a1
#    spot: x= 265.0 y = 32.665."
#
# Changes vs. the previous committed rev (2026-09-01, old frame):
#   vial_3 .. vial_6            removed (pipette_test.yaml only uses 1 and 2)
#   vial_1 location             (206, 27, 55)   ->  (189, 0.665, 54)
#   vial_2 location             (206, 60, 55)   ->  (189, 33, 54)
#   tip_rack calibration.a1     (336, 37.5)     ->  (319.0, 45.664)   converted
#   tip_rack calibration.a2     (327.5, 37.5)   ->  (310.5, 45.664)
#   tip_rack location x / y     (336.5, 37.5)   ->  (319.5, 45.664)
#   pickup_z 57, drop_z null, tip_length 35, everything else   unchanged
#
# ---------------------------------------------------------------------------
# The tip-rack anchor: the jog reading plus the NEW pipette offset
# ---------------------------------------------------------------------------
# The jog display shows raw WPos, which is the capper's frame (offset 0/0).
# CubOS commands gantry = deck - instrument offset, so a point read with the
# PIPETTE over it sits in the deck frame at reading + pipette offset. The
# offset is the 2026-09-26 one, (54.0, 12.999), not the old (52, 12):
#   a1 = (265.0 + 54.0, 32.665 + 12.999) = (319.0, 45.664)
# a2 is one 8.5 mm column step in -X of a1, as in every rev since 2026-08-24;
# rows advance +Y, so A1..O1 run deck y 45.664..164.664 (gantry 32.665..151.665,
# all inside the working volume). location keeps Ben's +0.5 mm X from a1.
#
# Checked through the CubOS loader, not asserted. pick_up_tip tip_rack.A1:
#   Moving OpentronsPipette to (319.000, 45.664, 57.000)
#                           -> gantry (265.000, 32.665, 57.000)
# which is the measured jog point exactly. The XY of the pickup reproduces the
# reading whatever the offset is; the offset only matters for points measured
# with the capper and visited by the pipette, i.e. the vials.
#
# ---------------------------------------------------------------------------
# vial_1 is outside the PIPETTE's reach (the capper reaches it fine)
# ---------------------------------------------------------------------------
# The pipette sits +12.999 mm in Y from the capper, so the lowest deck Y it can
# reach is 12.999 (gantry y 0). vial_1 at y 0.665 would need gantry y -12.334:
#   pipette -> vial_1.location.action_z: gantry (135.0, -12.334, 54.0)
#   violates y_min=0.0
# so validate_setup FAILS pipette_test.yaml's `aspirate: vial_1`. vial_2
# (gantry y 20.001) is fine. The fix is physical or a protocol choice, not a
# number here: see ../../results/pipette_test_20260926b/README.md, section 3.
#
# ---------------------------------------------------------------------------
# pickup_z 57: unverified in this frame
# ---------------------------------------------------------------------------
# No Z came with the new reading. pick_up_tip is a friction press with no
# sensor, so a miss is silent; jog the nozzle down onto A1 once and read Z.
#
# drop_z: null is still right. drop_z is only a bounding-box height at this
# CubOS version (tip_rack.py: max(abs(pickup_z - drop_z), 1.0)), never a motion
# target. drop_tip engages the TIP END to the rack's z 57 = gantry 92, a full tip
# length above the slot; the real fix is a `tip_disposal` deck entry.

