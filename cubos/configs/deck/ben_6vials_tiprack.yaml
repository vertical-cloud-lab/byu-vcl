# ben_6vials_tiprack.yaml -- @benwhitney5463's 6-vial column plus the 2x15 tip
# rack, CubXL, 2026-08-31 rev 2.
#
# Attached to PR #171 on 2026-08-31. THE BODY BELOW IS BEN'S, VERBATIM --
# no conversion was applied this time (see below for why, and for the one
# thing to confirm by jog before the next hardware run).
#
# Changes vs. the rev committed at 87c3c55 (which ran as campaign 33):
#   tip_rack.calibration.a1.x   336.0 -> 366.0   (+30)
#   tip_rack.calibration.a2.x   327.5 -> 357.5   (+30)
#   tip_rack.location.x         336.5 -> 366.5   (+30)
#   tip_rack.pickup_z            60   -> 57
#   drop_z                       null (unchanged -- correct, see below)
# All six vials are byte-for-byte unchanged.
#
# ---------------------------------------------------------------------------
# CONFIRM BEFORE RUNNING: is the anchor already in the pipette's deck frame?
# ---------------------------------------------------------------------------
# Ben's note was that the coordinates were read with the pipette tip hovering
# over the rack while the capper_decapper is the reference instrument, so the
# +52/+12 conversion may be needed. I did NOT apply it, because the Y says it
# already has been:
#
#   the rev at 87c3c55 has a1 = (336.0, 37.5). Its 37.5 is itself a CONVERTED
#   value (measured 25.5, + the pipette's offset_y 12.0). This rev keeps
#   37.5 and moves only X by +30. A fresh raw reading would not land on a
#   previously-converted Y by coincidence.
#
# So this file reads as "the committed, already-converted rev with the rack
# shifted 30 mm in +X", and applying the conversion a second time would put
# the pickup 52/12 mm off. Taken at face value it commands the pipette to
# gantry (314.0, 25.5, 57.0) -- verified through the loader.
#
# *** If instead you re-measured from scratch and pasted a raw reading, then
# *** a1 must become (418.0, 49.5) and gantry X would be 366. One jog over
# *** A1 settles it: the display should read 314.0, 25.5.
#
# Note that validate_setup PASSES either way -- it only asks whether a
# coordinate is reachable, never whether it is the right one. Both (314, 25.5)
# and (366, 37.5) are inside the working volume.
#
# ---------------------------------------------------------------------------
# pickup_z 60 -> 57
# ---------------------------------------------------------------------------
# Ben lowered this because no tip was picked up in campaign 33. Sound
# direction: $132 moving 125 -> 124 in the recalibration shifts every deck Z
# reading by 1 mm, and 60 was carried unverified from the 2026-08-06
# measurement. pick_up_tip is a friction press with NO sensor, so neither
# CubOS nor the firmware can report a miss -- this needs an eyeball.
#
# One thing it is NOT: the plunger. pick_up_tip's plunger command (MOVE_TO 0)
# was a no-op in campaign 33, but on this pipette the tip is seated by
# pressing the nozzle into the tip, not by the plunger, so the failed pickup
# is a Z/XY question only. See ../../results/pipette_bench_20260831/README.md.
#
# ---------------------------------------------------------------------------
# drop_z: null -- correct, leave it
# ---------------------------------------------------------------------------
# Reverted from the 60 tried on 2026-08-28. At this CubOS version drop_z is
# read in exactly one place, deck/labware/tip_rack.py:158-160, as
# max(abs(pickup_z - drop_z), 1.0) -- a bounding-box height, never a motion
# target. Setting it equal to pickup_z collapses the rack's modeled height to
# 1.0 mm and overrides the explicit `height: 66`.
#
# drop_tip still ejects a full tip-length above the slot: it engages the TIP
# END to the rack's location.z 57 (gantry 92), while a seated tip's end is at
# deck 22. The real fix is a `tip_disposal` deck entry -- that is what
# drop_tip is meant to target, and it ejects at that entry's own location.z.
# Give me a spot for used tips and I will add it.

