# ben_6vials_tiprack.yaml -- @benwhitney5463's 6-vial column plus the 2x15 tip
# rack, for the CubXL as re-calibrated 2026-08-27/28.
#
# Attached to PR #171 on 2026-08-31 and committed with the body exactly as
# sent EXCEPT the tip-rack anchor, which is converted from the reference
# instrument's frame into the pipette's deck frame (below). Everything else
# -- all six vials, the rack's geometry block, drop_z: null -- is byte-for-
# byte Ben's. RUN ON HARDWARE 2026-08-31, 18/18 steps, campaign 33.
#
# ---------------------------------------------------------------------------
# THE ONE CHANGE: tip-rack anchor (284, 25.5) -> (336.0, 37.5)
# ---------------------------------------------------------------------------
# Ben measured the anchor by jogging until the PIPETTE TIP hovered over the
# rack's corner tip and reading the display -- but the display always reports
# the REFERENCE instrument, and that is vial_capper_decapper, whose offsets
# are 0/0. So (284, 25.5) is a raw work-coordinate (gantry) reading, not a
# deck-frame coordinate. Deck coordinates are instrument-independent; CubOS
# converts with `gantry = deck - offset`, so the deck-frame value is the
# reading PLUS the pipette's offset:
#
#     (284 + 52.0, 25.5 + 12.0) = (336.0, 37.5)
#
# Verified through the loader rather than asserted -- with this anchor,
# `pick_up_tip: tip_rack.A1` commands the gantry to exactly (284.0, 25.5,
# 60.0), reproducing Ben's measured point to the millimetre. Left unconverted
# it would command (232.0, 13.5): 52 mm and 12 mm short, which puts the
# CAPPER over the rack and presses the pipette into bare deck. Note that
# validate_setup PASSES either way -- it only asks whether a coordinate is
# reachable, never whether it is the right one. Same conversion as the
# 2026-08-08 (Jarrett) and 2026-08-24 anchors.
#
# Derived grid: column 1 at deck x 336.0, column 2 at 327.5, rows A..O at
# deck y 37.5 -> 156.5 (8.5 mm pitch). All 30 tips in the working volume.
#
# ---------------------------------------------------------------------------
# CONFIRMED ON HARDWARE 2026-08-31: the vial column is in the current frame
# ---------------------------------------------------------------------------
# This was the open question from 2026-08-28. The recalibration moved
# $131 (max_travel_y) 235 -> 309, and since WCO = -max_travel on every axis,
# that shifts the deck Y origin by 74 mm -- so a vial that read gantry Y 26
# before should read Y 100 after, yet this file still says 27. Either the
# holder had physically moved or the Y column was stale.
#
# The machine answered it: `decap vial_1` at deck (206, 27) captured its cap
# on the FIRST attempt, and all five vials decapped and capped without a
# single retry. If the column were stale by 73 mm the capper would have fired
# the magnet over bare deck and the line-break interlock would have aborted
# the run at step 2. It did not. These coordinates describe the machine.
#
# location.z 55 is the vial RIM (Ben's convention). A seated cap tops out at
# about deck Z 68 = rim + the capper's engage_depth_mm 13.
#
# ---------------------------------------------------------------------------
# STILL UNVERIFIED
# ---------------------------------------------------------------------------
#   * pickup_z 60 / location.z 60 carry forward from 2026-08-06 and were not
#     re-measured with the new anchor. $132 also moved 125 -> 124, which
#     shifts every deck Z reading down 1 mm, so a physically unmoved rack
#     would now read 59. The 2026-08-31 pick_up_tip pressed to gantry 60 and
#     the run completed, but pick_up_tip is a friction press with no sensor --
#     it cannot report a miss. Worth a jog check.
#   * a2 assumes the rack is square to the axes and its second column is one
#     8.5 mm step in -X of the measured tip. If the rack is mirrored, the fix
#     is one number: a2.x 327.5 -> 344.5.
#   * tip_present lists all 30 tips loaded. A1 has now been consumed by at
#     least one run; refill the slot or retarget before re-running.
#
# drop_z is back to null, which is correct -- see the 2026-08-28 header note
# and cubos/results/pipette_test_20260828/README.md. At this CubOS version no
# command reads it for motion; setting it only shrinks the rack's modeled
# bounding box to abs(pickup_z - drop_z), clamped to 1 mm.
