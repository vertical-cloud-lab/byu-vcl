  vial_6:
    type: vial
    name: vial_6
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 187
      y: 191
      z: 55
    capacity_ul: 1500
    working_volume_ul: 1200
    dead_volume_ul: 0
  tip_rack:
    load_name: ursa_tip_rack  # CubXL docs spec: 2 cols x 15 rows, 8.5 mm pitch
    calibration:
      a1:            # measured: pipette over the bottom-right tip at WPos
        x: 317.0     #   (265.0, 1.0) in the capper's reference frame,
        y: 13.0      #   + pipette offset (52.0, 12.0) -> deck (317.0, 13.0)
        z: 60.0      # = pickup_z (rack reference surface)
      a2:            # DERIVED, not measured: one 8.5 mm column step in -X
        x: 308.5     #   (rack assumed square to the axes; see header)
        y: 13.0
    pickup_z: 60.0   # Ben's 2026-08-06 measured pickup plane -- confirm by jog
    drop_z: null     # overrides the definition's PANDA-frame 174.8 (out of travel)
    tip_length: 35.0 # measured tip extension (definition default 59.3 is a placeholder)
