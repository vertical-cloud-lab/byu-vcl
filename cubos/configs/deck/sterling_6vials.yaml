  vial_6:
    type: vial
    name: vial_6
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 112.5
      y: 210.5
      z: 55
    capacity_ul: 1500
    working_volume_ul: 1200
    dead_volume_ul: 0
  # Single-tip "rack" for the capper_decapper_tip_test protocol (see header).
  # tip_length 35.0 is the value stated in the request ("the pipette tip adds
  # 35mm to the pipette"); after pick_up_tip, every pipette deck-frame Z in a
  # protocol means the TIP END, not the bare nozzle.
  # calibration.a2 only fixes the rack's row orientation (required by the
  # schema); with rows=1, columns=1 no second tip is generated from it.
  tip_rack:
    type: tip_rack
    name: tip_rack
    rows: 1
    columns: 1
    pickup_z: 60.0
    tip_length: 35.0
    x_offset: 10.0
    y_offset: 10.0
    calibration:
      a1:
        x: 255.5
        y: 33.5
        z: 60.0
      a2:
        x: 265.5
        y: 33.5
        z: 60.0
