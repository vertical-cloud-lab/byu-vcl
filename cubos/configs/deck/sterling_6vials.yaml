    capacity_ul: 1500
    working_volume_ul: 1200
    dead_volume_ul: 0
  vial_4:
    type: vial
    name: vial_4
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 112.5
      y: 144.5
      z: 55
    capacity_ul: 1500
