# Sterling deck, re-measured 2026-08-06: six bare vials in a line at deck
# X ~113 (no vial_holder nesting -- each vial's location.z IS the rim, per
# cubos.deck.labware.vial.Vial). Attached by @benwhitney5463 to PR #171 on
# 2026-08-06; vial entries are byte-identical to that attachment.
#
# ONE ADDITION vs. the attachment: the `tip_rack` entry at the bottom.
# The requested protocol picks up a 35 mm pipette tip, and CubOS only
# models an attached tip's extra length (for motion targets AND for
# validate_setup bounds checking) through a TipRack labware + the
# `pick_up_tip` command -- a raw `move` to the rack would leave the
# validator blind to the 35 mm of extra tool hanging below the nozzle.
# Position and pickup Z are exactly the numbers given in the request:
# x 255.5, y 33.5, z 60 (nozzle presses down to deck-frame Z 60 to seat
# the tip). Modeled as a 1x1 rack holding the single tip A1.

labware:
  vial_1:
    type: vial
    name: vial_1
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 113
      y: 44.5
      z: 55
    capacity_ul: 1500
    working_volume_ul: 1200
    dead_volume_ul: 0
  vial_2:
    type: vial
    name: vial_2
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 113
      y: 78.5
      z: 55
    capacity_ul: 1500
    working_volume_ul: 1200
    dead_volume_ul: 0
  vial_3:
    type: vial
    name: vial_3
    model_name: ''
    height: 83
    diameter: 28
    location:
      x: 112.5
      y: 111.5
