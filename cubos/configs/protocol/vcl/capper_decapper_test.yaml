# Capper/decapper + pipette-insertion test, vial_1 through vial_6.
#
# For each vial in order 1 -> 6:
#   1. decap   - the capper approaches at safe_z, engages at engage_depth_mm
#                (deck-frame Z 57.0 - 15.0 = 42.0), captures the cap,
#                retracts to safe_z, and parks
#   2. insert  - the pipette descends into the now-open vial to Z 47.0, i.e.
#                10 mm below the vial rim (rim is at deck-frame Z 57.0)
#   3. retract - the pipette lifts back to the Z 105.0 transit plane
#   4. cap     - the capper replaces the cap, retracts, and parks
#
# Config trio:
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper.yaml
#   deck:     ../../deck/sterling_deck.yaml
#   protocol: this file
#
# Validate offline, dry-run, then hardware (from the CubOS checkout, with the
# three paths above):
#   python -m cubos.tools.validate_setup            <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock       <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol              <gantry> <deck> <protocol>
#
# vial_1 IS NOT REACHABLE BY THE PIPETTE as the deck is currently measured,
# so its two `move` steps are commented out below. The capper still decaps
# and caps vial_1; only the pipette insertion is skipped. With them left in,
# validate_setup FAILS:
#
#   pipette -> vial_1_insert.location.target:
#     gantry (27.0, -15.0, 47.0) violates y_min=0.0
#
# The pipette is mounted offset_y = +20.0, so putting its tip on vial_1
# (deck Y 5.0) needs the gantry at Y -15.0 -- 15 mm past the machine's Y
# travel, not just past a soft limit. Anything at deck Y < 20.0 is out of
# the pipette's reach; vials 2-8 are all fine. To get vial_1 back:
#   * shift the vial holder at least +15 mm in +Y and re-measure the deck
#     YAML (a uniform +15 mm on every vial's `location.y`, plus the matching
#     `vial_N_insert` / `vial_N_retract` entries below, validates PASS), or
#   * re-measure the pipette's offset_y if +20.0 is not the true mount
#     offset, or
#   * run six *reachable* vials instead -- retarget the whole protocol at
#     vial_2..vial_7 (deck Y 39/73/103/134/165/196), which needs no
#     hardware change and gives a full decap -> insert -> cap on all six.
#
# Do NOT fix this by pointing `vial_1_insert` at another vial's Y while the
# `decap`/`cap` steps still say `vial_holder.vial_1`: that decaps vial_1 and
# then drives the pipette into a still-capped vial. (E.g. Y 196.0 is
# vial_7.) The capper target and the pipette target must name the same vial.
#
# Notes on the numbers below:
#   * travel_z 105.0 == the gantry's safe_z. It is set to 105.0 (not the
#     original 85.0) so the pipette clears the Cub XL right X-max rail on its
#     first move out of the homed corner -- see the header of
#     cub_xl_ben_pipette_capper.yaml.
#   * Insertion depth is deliberately shallow: the vial rim is at Z 57.0 and
#     the vial is 50 mm tall, so the interior floor is near Z 7.0. Z 47.0 is
#     10 mm in, enough to prove entry without risking a bottom strike. Lower
#     `vial_N_insert` Z to go deeper once clearance is confirmed by eye.
#   * This runs the bare pipette nozzle -- no `pick_up_tip`. Adding one
#     changes the effective tip extension, so re-run validate_setup and
#     re-check the insertion plane if you add tips.

positions:
  # vial_1 disabled -- gantry Y would be -15.0, outside the working volume.
  # vial_1_insert: [162.0, 5.0, 47.0]
  # vial_1_retract: [162.0, 5.0, 105.0]
  vial_2_insert: [162.0, 39.0, 47.0]
  vial_2_retract: [162.0, 39.0, 105.0]
  vial_3_insert: [162.0, 73.0, 47.0]
  vial_3_retract: [162.0, 73.0, 105.0]
  vial_4_insert: [162.0, 103.0, 47.0]
  vial_4_retract: [162.0, 103.0, 105.0]
  vial_5_insert: [162.0, 134.0, 47.0]
  vial_5_retract: [162.0, 134.0, 105.0]
  vial_6_insert: [162.0, 165.0, 47.0]
  vial_6_retract: [162.0, 165.0, 105.0]

protocol:
  - home:

  # --- vial 1 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_1

  # Pipette insertion skipped for vial_1 -- out of reach, see header.
  # - move:
  #     instrument: pipette
  #     position: vial_1_insert
  #     travel_z: 105.0
  #
  # - move:
  #     instrument: pipette
  #     position: vial_1_retract
  #     travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_2

  - move:
      instrument: pipette
      position: vial_2_insert
      travel_z: 105.0

  - move:
      instrument: pipette
      position: vial_2_retract
      travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_3

  - move:
      instrument: pipette
      position: vial_3_insert
      travel_z: 105.0

  - move:
      instrument: pipette
      position: vial_3_retract
      travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_4

  - move:
      instrument: pipette
      position: vial_4_insert
      travel_z: 105.0

  - move:
      instrument: pipette
      position: vial_4_retract
      travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_5

  - move:
      instrument: pipette
      position: vial_5_insert
      travel_z: 105.0

  - move:
      instrument: pipette
      position: vial_5_retract
      travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_5

  # --- vial 6 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_6

  - move:
      instrument: pipette
      position: vial_6_insert
      travel_z: 105.0

  - move:
      instrument: pipette
      position: vial_6_retract
      travel_z: 105.0

  - cap:
      instrument: vial_capper_decapper
      vial: vial_holder.vial_6

  - home:
