# pipette_test.yaml -- decap vial_1, pick up a tip, mix in vial_1, drop the
# tip back at the rack, then cap vial_1 and decap+cap vials 2..6.
# CubXL, 2026-08-24 deck/gantry calibration.
#
# @benwhitney5463's 2026-08-26 revision, committed exactly as attached to
# PR #171. NOT run on hardware -- the GitHub runner lost tailnet access to the
# Pi (see cubos/results/pipette_test_20260826/README.md). Only this header was
# rewritten; the previous one described the `move`-stroke substitutions this
# revision replaces with literal `mix:` and `drop_tip:`.
#
# Run it with:
#   python -m cubos.tools.validate_setup      <gantry> <deck> <this>
#   python -m cubos.tools.run_protocol --mock <gantry> <deck> <this>
#   python -m cubos.tools.run_protocol        <gantry> <deck> <this>
#
# OFFLINE STATUS (2026-08-26, CubOS cbc33dc + the two patches on the Pi):
#   validate_setup PASS (10 targets) - run_protocol --mock 19/19 steps.
#
# ===========================================================================
# THE ONE INVARIANT THIS PROTOCOL RESTS ON: the tip is off by step 7
# ===========================================================================
# Steps 3-6 are the only tipped steps. From step 7 (`cap vial_1`) onward every
# move belongs to the capper and travels at capper deck Z 87 -> gantry 71.065.
# With the tip gone that is the bare nozzle at deck 71.065, about 3 mm over
# the caps. With the tip still on it is the TIP END at deck 36.065 -- 19 mm
# below the vial rims and 32 mm below the cap tops -- sweeping across the vial
# column on every park leg. That is a hard crash, 20 times.
#
# Nothing in CubOS verifies the tip actually left. `drop_tip` drives the
# plunger to p20_single_gen2's drop_tip_position, which models.py marks
# `# placeholder`, and then calls clear_attached_tip_extension() whether or
# not the tip came off. The engine believes the nozzle is bare from step 6 on.
#
# So for the FIRST run with the plunger live, do one of:
#   * split this file after step 6 and eyeball the nozzle before running the
#     capper half, or
#   * put a `breakpoint:` between step 6 and step 7 AND run it from a
#     foreground terminal -- a headless run logs "Breakpoint skipped because
#     stdin is not interactive" and continues straight into the capper legs.
#
# ===========================================================================
# TWO THINGS THAT ARE PROBABLY NOT WHAT WAS INTENDED
# ===========================================================================
# 1. `mix` never enters the vial. The command signature is
#    mix(position, volume_ul, repetitions=3, speed=50.0, height=0.0), and
#    engage_at_labware descends the tool point to coord.z + height. With
#    height defaulted to 0.0 that is deck Z 55.0 -- the vial rim exactly, tip
#    end level with the mouth. Add `height: -15.0` to reach deck Z 40 (gantry
#    75), the same depth the previous revision's strokes used. Validated:
#    PASS on both the Pi's CubOS and the patched one.
#
# 2. The mix moves 0.5 mm of plunger, not 20 uL. The driver computes
#    mm_travel = volume_ul * mm_to_ul, and mm_to_ul is 0.025 `# placeholder`
#    for this pipette model. The plunger constants need measuring before any
#    volume in this file means microlitres.
#
# Also: `drop_tip` ejects 35 mm above the rack. Its engage descends the TIP
# END to the rack's pickup_z 60 (gantry 95), but the tip was seated with its
# end at deck 25. The tip is released well above its hole and will not seat
# back in it. A dedicated `tip_disposal` deck entry is the proper target once
# the plunger is calibrated.
#
# ===========================================================================
# GEOMETRY AS RUN (from the --mock trace)
# ===========================================================================
#   step 1  pipette -> park           deck (170, 170, 80)  gantry (118, 158, 80)
#   step 2  capper transit            deck Z 87            gantry Z 71.065
#           capper engage vial_1      deck Z 68            gantry Z 52.065
#   step 3  tip pickup (bare nozzle)  deck (317, 13, 60)   gantry (265, 1, 60)
#   step 4  mix hover (tip end 87)                         gantry Z 122 (= z_max)
#           mix engage (tip end 55)                        gantry Z 90
#   step 5  tipped park (tip end 80)                       gantry Z 115
#   step 6  drop hover (tip end 87)                        gantry Z 122
#           drop engage (tip end 60)                       gantry Z 95
#   steps 7-17  capper only           deck Z 87 / 68       gantry 71.065 / 52.065
#
# Eyeball before running (no offline check models the PASSIVE instrument):
#   * deck X ~239, Y 14-203, above Z 71 -- the nozzle's shadow during every
#     capper leg, including the crossings over vial_2/vial_3 noted in the
#     gantry file.
#   * deck X ~135, Y 14, down to Z 90 -- the capper's shadow during the mix.
#   * deck X ~256.5-265, Y 1, down to Z ~44 -- the capper during tip pickup.
#
# pickup_z 60.0 is still the un-re-verified 2026-08-06 number; worth a jog
# check before the first real pickup. Each run consumes tip_rack.A1 in the
# model -- refill the slot or retarget `pick_up_tip` before re-running.

positions:
  park_position: [170.0, 170.0, 80.0]
  park_tip_removal: [170.0, 170.0, 80.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: pipette
      position: park_position
      travel_z: 80.0

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - mix:
      position: vial_1
      volume_ul: 20.0
        
  - move:
      instrument: pipette
      position: park_position
      travel_z: 80.0

  - drop_tip:
        position: tip_rack.A1




  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5

  # --- vial 6 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_6

  - cap:
      instrument: vial_capper_decapper
      vial: vial_6

  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
