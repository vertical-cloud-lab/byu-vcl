# pipette_test.yaml -- @benwhitney5463's 2026-08-28 revision, committed with
# the body exactly as attached to PR #171 (parsed YAML verified identical;
# only this header changed). The requested sequence:
#
#   home -> park -> decap vial_1 -> pick_up_tip A1 -> aspirate in vial_1
#   -> cap vial_1 -> decap vial_2 -> blowout in vial_2 -> drop_tip
#   -> cap vial_2 -> decap+cap vials 3..6 -> home
#
# Config trio:
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper_tipsafe.yaml   <-- SEE BELOW
#   deck:     ../../deck/ben_6vials_tiprack.yaml
#   protocol: this file
#
#   python -m cubos.tools.validate_setup       <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock  <gantry> <deck> <protocol>
#   python -m cubos.tools.passive_shadow       <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol         <gantry> <deck> <protocol>
#
# ===========================================================================
# DO NOT RUN THIS WITH cub_xl_ben_pipette_capper.yaml (safe_z 87).
# ===========================================================================
# It passes validate_setup AND --mock, and it still drives the attached tip
# into vial_1. Both offline gates only check the instrument a command NAMES;
# neither models the other tool on the head. Swept properly (2026-08-28, see
# cubos/results/pipette_test_20260828/ and cubos/tools/passive_shadow.py):
#
#   step 5 cap vial_1   tip end (206.0, 27.0, 36.06) -> (258.0, 27.0, 36.06)
#   step 5 cap vial_1   tip end (258.0, 39.0, 36.06) -> (177.0, 39.0, 36.06)
#   step 6 decap vial_2 tip end (177.0, 62.0, 36.06) -> (258.0, 62.0, 36.06)
#   step 6 decap vial_2 tip end (258.0, 72.0, 36.06) -> (177.0, 72.0, 36.06)
#
# The first line is the fatal one. After `aspirate` the tip is 15 mm inside
# vial_1 at deck Z 40. `cap`'s approach is move_to_labware, which lowers to
# the CAPPER's travel plane at the CURRENT XY -- gantry 71.065, tip end
# 36.06, i.e. deeper -- and only then translates X. The tip is dragged
# sideways through the vial neck, 19 mm below the rim. The other three sweep
# the tip 32 mm below the cap tops across vial_1 and vial_2.
#
# (Motion is axis-by-axis, never diagonal: gantry_driver/driver.py
# _build_direct_move emits one G01 per changed axis, X then Y then Z, and
# _build_transit_move does lift -> X -> Y -> descend. Earlier notes in this
# repo that described capper legs as diagonals were wrong about the path
# shape; the vertical clearances were right.)
#
# ---------------------------------------------------------------------------
# WHY NO VALUE OF safe_z FIXES IT -- the window is 32 mm wide and empty
# ---------------------------------------------------------------------------
# safe_z is one number shared by both tools, and it is applied at each
# tool's own point. With a 35 mm tip on, the pipette's tool point sits
# 50.935 mm below the capper's (35 tip + the capper's depth -15.935):
#
#   aspirate/blowout/drop_tip hover:  gantry = safe_z + 35 <= z_max 122
#                                                        -> safe_z <= 87
#   capper legs clear cap tops (68):  safe_z - 50.935 >= 68
#                                                        -> safe_z >= 119
#
# safe_z 87 is right for the first half -- it is the ONLY value that makes a
# literal aspirate/blowout validate -- and it is exactly what makes capper
# motion lethal to an attached tip. This protocol needs both at once.
# Raising safe_z is not even available: GantryYamlSchema rejects it above
# working_volume.z_max ("cnc.safe_z (130.0) must be within [0.0, 122.0]").
#
# ---------------------------------------------------------------------------
# THE CONFIGURATION THIS FILE IS VERIFIED AGAINST
# ---------------------------------------------------------------------------
# cub_xl_ben_pipette_capper_tipsafe.yaml (safe_z 122, capper park_position
# [206, 50]) PLUS cubos/patches/tipped-hover-clamp-and-ceiling-travel.patch
# applied to the Pi's CubOS. The patch decouples the tipped hover from safe_z
# and rides XY travel at the working-volume ceiling, so capper transits carry
# the tip end at deck 87 -- 19 mm over the caps -- while a tipped engage
# still clamps to gantry 122. Park on the vial column makes every capper leg
# a pure-Y move at nozzle deck X 258, 38 mm clear of the vials.
#
#   validate_setup: PASS (19 steps)   run_protocol --mock: 19/19
#   passive_shadow [nominal]:      0 interferences
#   passive_shadow [--tip-stuck]:  0 interferences
#
# That last line is the one that matters for this protocol: Ben asked not to
# gate the run on confirming the tip actually left the nozzle. Under this
# configuration that is safe -- if the tip stays on for the whole run,
# nothing it passes is closer than the clearances above. Under safe_z 87 a
# stuck tip is 25 interferences, including dragging through the tip rack on
# step 9's approach.
#
# ---------------------------------------------------------------------------
# STILL UNVERIFIED -- needs eyes on the machine
# ---------------------------------------------------------------------------
#  * The strip deck x ~ 240-275, y ~ 15-205 must be clear from deck Z ~17 up.
#    During every capper engage the passive pipette descends to gantry
#    52.065; with a tip on that is a tip end at deck Z 17.065 at
#    (258, vial_y + 12). No offline check models the vial holder, brackets or
#    cabling -- they are not in the deck file.
#  * `drop_tip: tip_rack.A1` cannot seat the tip: it ejects 35 mm above the
#    slot, and drop_tip_position is a documented placeholder in
#    instruments/pipette/models.py. See the deck header for the real fix
#    (a tip_disposal entry). Each run also consumes A1 in the tip-state
#    model -- refill or retarget before re-running.
#  * pickup_z 60.0 is still the 2026-08-06 number, never re-jogged.
#  * The Arduino reports max_vol 300 while the config says p20_single_gen2;
#    mm_to_ul 0.025 is the p20 number, so `volume_ul: 20.0` is 0.5 mm of
#    plunger travel, not 20 microlitres. Worth settling which pipette is
#    actually mounted before reading anything into the aspirate volume.
positions:
  park_position: [206.0, 170.0, 87.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -15.0



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -15.0
      
  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5

  # --- vial 6 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_6

  - cap:
      instrument: vial_capper_decapper
      vial: vial_6

  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
