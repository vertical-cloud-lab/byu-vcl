# pipette_test.yaml -- @benwhitney5463's 2026-08-28 rev 2 (PR #171), with two
# corrections applied. The requested sequence is unchanged:
#
#   home -> park -> decap vial_1 -> pick_up_tip A1 -> aspirate in vial_1
#   -> retract -> cap vial_1 -> decap vial_2 -> blowout in vial_2
#   -> drop_tip -> cap vial_2 -> decap+cap vials 3..6 -> home
#
# Config trio:
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper.yaml   (safe_z 87)
#   deck:     ../../deck/ben_6vials_tiprack.yaml
#   protocol: this file
#
#   python -m cubos.tools.validate_setup       <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock  <gantry> <deck> <protocol>
#   python -m cubos.tools.passive_shadow       <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol         <gantry> <deck> <protocol>
#
# ===========================================================================
# WHAT CHANGED FROM THE ATTACHMENT, AND WHY
# ===========================================================================
# The rev-2 attachment differed from rev 1 in exactly two places: `travel_z:
# 87` was added to the step-1 park move, and a new `move` back to
# park_position was inserted between `aspirate` and `cap vial_1` -- the
# retract that rev 1 was missing. Right idea. Two problems stopped it.
#
# 1. `instrumet:` (typo) on the new move. Protocol YAML is validated against
#    a strict per-command Pydantic schema at LOAD time (registry.py builds it
#    from each handler's signature with extra="forbid"), so the whole file is
#    rejected before step 0 -- nothing runs, nothing moves:
#
#      protocol.5.instrument   Field required
#      protocol.5.instrumet    Extra inputs are not permitted
#      RESULT: ERROR - could not load protocol
#
#    Fixed to `instrument:`.
#
# 2. With the typo fixed, the retract move made the shear WORSE, not better.
#    `travel_z` is applied in the MOVING instrument's tool frame
#    (instrument_mount.py:71 -- gantry_travel_z = travel_z + depth). Named to
#    the capper (depth -15.935), `travel_z: 87` resolves to gantry 71.065.
#    After `aspirate` the tip already sits at gantry 75. So the step LOWERED
#    the head 3.9 mm -- driving the tip deeper into vial_1 -- and then
#    translated X. Swept with passive_shadow:
#
#      step 5 move   passive=pipette (tip=on)
#        -> vial_1: 0.0 mm from its axis, tool point down to Z 36.065
#           vs obstacle top 55.0
#           (206.0, 27.0, 36.06) -> (258.0, 27.0, 36.06)
#
#    That is the tip dead-centre in vial_1, 19 mm below the rim, translating
#    52 mm sideways. Fixed by naming the PIPETTE and adding a `pipette_park`
#    position that is the same physical head pose expressed in the pipette's
#    frame: travel_z 87 then resolves to gantry 87 + 35 (tip) = 122, so the
#    tip lifts clear of the rim before any XY motion.
#
# ===========================================================================
# THE GANTRY FILE ALSO NEEDED ONE CHANGE: capper park_position -> [206, 50]
# ===========================================================================
# `decap`/`cap` each end with a hardcoded park move at the capper's safe_z
# (gantry 71.065 at safe_z 87), and the pipette is the LOWEST thing on the
# head, so with a tip attached its tip end rides those legs at deck Z 36.065
# -- 19 mm below the vial rims, 32 mm below the cap tops. That is harmless
# only while the legs never pass laterally over a vial. With park [125, 50]
# (off the vial column) every leg has an X component that walks the tip
# straight across the column:
#
#   step 6 cap   -> vial_1: 12.0 mm from its axis, Z 36.065 vs cap top 68.0
#   step 7 decap -> vial_2:  2.0 mm from its axis, Z 36.065 vs cap top 68.0
#   step 7 decap -> vial_2: 12.0 mm from its axis, Z 36.065 vs rim 55.0
#
# Parking at [206, 50] -- the vial column's own X -- makes every capper leg a
# pure-Y move, holding the tip at deck X 258, i.e. 52 mm clear of the column.
# Verified: 0 interferences. This is why safe_z 87 is now workable WITHOUT
# the tipped-hover-clamp patch; the 2026-08-28 note that the safe_z window
# was "empty by 32 mm" was a vertical-clearance argument, and moving the park
# on-column removes the requirement rather than satisfying it.
#
# ===========================================================================
# OFFLINE RESULTS (CubOS cbc33dc + the two Pi patches, 2026-08-28)
# ===========================================================================
#   validate_setup                    PASS, 20 steps, 12 targets
#   run_protocol --mock               20/20
#   passive_shadow                    0 interferences
#   passive_shadow --tip-stuck        3 interferences, all at step 10
#
# The tip-stuck case is the one residual risk and it has no config fix.
# `drop_tip` calls clear_attached_tip_extension() unconditionally, so from
# step 10 on CubOS plans in the bare-nozzle frame regardless of what
# physically happened. If the tip is still on, `cap vial_2` lowers it into
# the tip rack (tip end Z 36.065 vs rack top 60.0) and then drags it across.
# @benwhitney5463 accepted this risk explicitly on 2026-08-28 ("I am watching
# the machine, and will manually remove the tip mid-run if needed"); the
# alternative is a `breakpoint:` between steps 9 and 10, which only works
# from a FOREGROUND terminal -- headless runs log "Breakpoint skipped because
# stdin is not interactive" and continue straight into that motion.
#
# Also still true: `drop_z: 60` in the deck file does not move anything. At
# this CubOS version drop_z is read in exactly one place
# (deck/labware/tip_rack.py:158-160) to derive the rack's modeled height as
# max(abs(pickup_z - drop_z), 1.0). With pickup_z 60 it evaluates to 1.0 mm,
# overriding the explicit `height: 22` and collapsing the rack's bounding
# box. `drop_tip` engages the TIP END to the rack's location.z (60, gantry
# 95) while a seated tip has its end at deck 25, so the release still happens
# a full tip-length above the slot. Set drop_z back to null; the real fix is
# a `tip_disposal` deck entry, which is what drop_tip is built for.
#
positions:
  park_position: [206.0, 170.0, 87.0]
  # ADDED: the same physical head pose as park_position, expressed in the
  # PIPETTE's frame. pipette deck = gantry + (52, 12), and with a 35 mm tip
  # the pipette's deck Z is gantry_z - 35. So gantry (206, 170, 122) ==
  # capper deck (206, 170, 87) == pipette deck (258, 182, 87).
  pipette_park: [258.0, 182.0, 87.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 87

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -15.0
  # CHANGED: instrument vial_capper_decapper -> pipette, position
  # park_position -> pipette_park (same head pose). travel_z is applied in
  # the MOVING instrument's tool frame: on the capper, travel_z 87 resolves
  # to gantry 87 + depth(-15.935) = 71.065, which is BELOW the gantry Z 75
  # the tip already sits at after `aspirate`. This step therefore lowered
  # the tip 3.9 mm DEEPER into vial_1 and then translated X, shearing it
  # out sideways. As the pipette, travel_z 87 resolves to gantry 87 + 35
  # (tip extension) = 122, so the tip lifts clear of the rim before any XY
  # motion. Verified 0 passive-instrument interferences either way.
  - move:
      instrument: pipette
      position: pipette_park
      travel_z: 87



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -15.0

  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5

  # --- vial 6 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_6

  - cap:
      instrument: vial_capper_decapper
      vial: vial_6

  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
