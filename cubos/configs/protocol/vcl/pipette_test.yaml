# pipette_test.yaml -- @benwhitney5463's 2026-08-27 revision, attached to
# PR #171: "I changed the protocol so the pipette tip actually enters the vial."
#
# Body committed exactly as attached (verified: parsed YAML identical to the
# attachment). Only this header is ours. Three changes vs. the 2026-08-26 rev:
#
#   positions.park_position   [170, 170, 80] -> [187, 170, 80]  (vial column X)
#   step 1 `move` instrument  pipette -> vial_capper_decapper
#   step 4 `mix`              + height: -15.0
#   (park_tip_removal removed; the breakpoint/stroke substitutions replaced by
#    literal `mix:` and `drop_tip:`)
#
# Config trio:
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper.yaml
#   deck:     ../../deck/sterling_6vials_tiprack.yaml
#
#   python -m cubos.tools.validate_setup      <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol        <gantry> <deck> <protocol>
#
# Status 2026-08-27: validate_setup PASS (19 steps), --mock 19/19. Steps 0..5
# RAN ON HARDWARE and completed (campaign 25, see
# cubos/results/pipette_test_20260827/) as pipette_test_partA.yaml. Steps 6..18
# were NOT run -- see the drop_tip block below.
#
# ---------------------------------------------------------------------------
# WHAT WORKS: `height: -15.0` does what you intended
# ---------------------------------------------------------------------------
# `mix` engages by descending the TOOL POINT to `coord.z + height`. With the
# rim at deck 55 that is deck Z 40.0 for the tip end, gantry Z 75.0 -- 15 mm
# inside the vial, nozzle still 20 mm above the rim. Confirmed in the traced
# mock and on hardware:
#
#   @@MOUNT OpentronsPipette deck=(187.0, 26.0, 87.0) travel_z=87.0
#   @@GANTRY x=135.000 y=14.000 z=122.000   <- tipped hover, exactly z_max
#   @@MOUNT (187.0, 26.0, 40.0)
#   @@GANTRY x=135.000 y=14.000 z= 75.000   <- tip 15 mm into the vial
#
# Without `height` the default 0.0 would have stopped the tip end level with
# the rim. safe_z 87 is what makes the tipped hover legal: 87 + 35 = 122 = z_max
# exactly. It validates, and it ran.
#
# ---------------------------------------------------------------------------
# >>> DO NOT RUN PAST STEP 5 UNTIL drop_tip IS FIXED <<<
# ---------------------------------------------------------------------------
# `drop_tip: tip_rack.A1` cannot return the tip to the rack, and everything
# after it is planned as if the nozzle were bare.
#
# 1. It ejects 35 mm in the air. drop_tip engages like any other pipette
#    command: the TOOL POINT (= tip end, with a tip on) descends to the rack's
#    pickup_z 60.0, i.e. gantry Z 95.0. A tip seated in A1 has its end at deck
#    Z 25 (nozzle at 60, tip 35 long). Traced: `@@GANTRY x=265 y=1 z=95.000`.
#    The tip is released one full tip-length above its slot.
# 2. The eject position is a placeholder. instruments/pipette/models.py,
#    p20_single_gen2: `drop_tip_position=10.0,  # placeholder`, alongside
#    prime_position 5.0, blowout_position 7.0, mm_to_ul 0.025. Same bucket as
#    the old CAPPER_ENGAGE_DEPTH_MM.
# 3. Nothing checks the outcome. commands/pipette.py calls
#    `pipette.clear_attached_tip_extension()` unconditionally after
#    `pipette.drop_tip(speed)` returns, so from step 7 on CubOS plans in the
#    bare-nozzle frame whatever physically happened.
#
# If the tip is still on the nozzle at step 7, the capper legs run at gantry
# 71.065, which puts the TIP END at deck Z 36.065 -- 19 mm below the vial rims
# (55) and 32 mm below the cap tops (~68) -- and with the capper parking at
# [125, 50] every leg is a diagonal that crosses the vial column at deck X 187.
# That is a lateral strike into a capped vial, about 20 times per run. There is
# no camera on the CubXL deck, so it cannot be verified remotely.
#
# The real fix is a `tip_disposal` deck entry (drop_tip's intended target,
# ejecting at that entry's own location.z) plus a measured drop_tip_position --
# neither is a protocol edit.
#
# ---------------------------------------------------------------------------
# ALSO OPEN
# ---------------------------------------------------------------------------
#   * Capper park_position [125, 50] is off the vial column, so with safe_z 87
#     each decap/cap leg walks the bare nozzle across cap tops at deck 71.065
#     vs. ~68 -- about 3 mm, closest pass 0.9 mm from vial_2's axis. Setting it
#     to [187.0, 50.0] makes every leg a pure-Y move at deck X 187 with the
#     nozzle held at deck X 239, over ground the engages already sweep 19 mm
#     lower. That is what the hardware run used.
#   * The firmware reports max_vol 300.00 but the gantry config declares
#     pipette_model: p20_single_gen2. Check which pipette is actually mounted;
#     mm_to_ul 0.025 is the p20 number either way, so volume_ul is not yet
#     microlitres (20 uL -> 0.5 mm of plunger).
#   * pick_up_tip consumes A1 in the model. Refill the slot or retarget before
#     re-running.
positions:
  park_position: [187.0, 170.0, 80.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 80.0

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - mix:
      position: vial_1
      volume_ul: 20.0
      height: -15.0
        
  - move:
      instrument: pipette
      position: park_position
      travel_z: 80.0

  - drop_tip:
        position: tip_rack.A1




  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5

  # --- vial 6 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_6

  - cap:
      instrument: vial_capper_decapper
      vial: vial_6

  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
