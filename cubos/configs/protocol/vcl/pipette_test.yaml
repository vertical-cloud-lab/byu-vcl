# pipette_test.yaml -- SHORTENED rev: decap vial_1, pick up a tip, aspirate in
# vial_1, park the pipette, recap vial_1, decap vial_2, blow out into vial_2,
# drop the tip, cap vial_2, home. CubXL, 2026-09-01 rev 2.
#
# Attached to PR #171 on 2026-09-01. THE BODY BELOW IS BEN'S, VERBATIM
# (parsed YAML verified identical to the attachment).
#
# *** NOT RUN ON HARDWARE. Every offline gate passes and the geometry is    ***
# *** sound, but OpentronsPipette.connect() cannot establish a plunger      ***
# *** reference: the limit switch never asserts, so run_protocol aborts     ***
# *** before step 0 with no gantry motion at all. Measured, not predicted   ***
# *** -- see ../../../results/pipette_test_20260901b/README.md.             ***
#
# Changes vs. the rev that ran as campaign 54 (commit 6758402):
#   positions.park_position  Y 170.0 -> 100.0
#   aspirate vial_1  height  -15.0  -> -35.0
#   blowout  vial_2  height  -15.0  -> -35.0
#   decap+cap of vials 3, 4, 5 commented out   (18 steps -> 12)
#
# ---------------------------------------------------------------------------
# height: -35.0 -- checked against the vial geometry, and it clears
# ---------------------------------------------------------------------------
# `height` is a labware-relative offset from the vial RIM, and an engage
# descends the moving instrument's TOOL POINT to `location.z + height`. With a
# 35 mm tip attached the tool point is the tip end, so:
#
#   vial rim (location.z)                       deck Z  55.0
#   + height                                          -35.0
#   = tip end                                   deck Z  20.0   -> gantry Z 55.0
#   nozzle (tip end + tip_length 35)            deck Z  55.0   == the rim
#
# Gantry Z 55 is the deepest pipette pose ever commanded on this machine (the
# -15.0 rev commanded 75). It is safe on the deck model: CubOS documents a
# vial's `height` as the OUTER height, rim -> underside (deck/labware/vial.py),
# so `height: 83` with the rim at deck 55 puts the underside at deck -28 and
# the tip end has ~45 mm of clearance to the floor.
#
# The number to eyeball is the nozzle, not the tip: it ends up at exactly rim
# height, so the nozzle shoulder is level with the vial mouth rather than the
# ~20 mm above it that the -15.0 rev gave. XY is proven correct (campaign 54's
# G-code put pick_up_tip on Ben's measured jog point to the millimetre), so
# this only matters if the rim Z is off or a tip fails to seat.
#
# ---------------------------------------------------------------------------
# park_position Y 170 -> 100
# ---------------------------------------------------------------------------
# This is the protocol's own named position for step 1 (the capper's first
# move out of the homed corner), not the capper's `park_position` in the
# gantry file, which is unchanged at [236, 175] and is what decap/cap use.
#
# Deck (206, 100) sits inside vial_3's footprint (centre Y 93, diameter 28),
# but at travel_z 100 the capper tool point rides deck Z 100 -- 30 mm above
# the cap tops at deck 70 -- and the passive pipette nozzle is at deck
# (258, 112), 52 mm clear of the column in X. passive_shadow: 0 interferences.
#
# ---------------------------------------------------------------------------
# Geometry, as commanded (mock trace, cubos/results/pipette_test_20260901b/)
# ---------------------------------------------------------------------------
#   step 1 capper park, travel_z 100        gantry Z  84.065
#   capper transit / park at safe_z 115     gantry Z  99.065
#   capper engage (rim 55 + engage 15)      gantry Z  54.065
#   bare-nozzle hover at safe_z 115         gantry Z 115.0
#   pick_up_tip tip_rack.A1                 gantry   (284.0, 25.5, 57.0)
#   tipped hover, CLAMPED by the patch      gantry Z 124.0
#   aspirate vial_1 / blowout vial_2        gantry Z  55.0    <- tip end deck 20
#   step 5 pipette_park, travel_z 87        gantry Z 122.0
#   drop_tip tip_rack.A1                    gantry Z  92.0
#
# Offline gates, on the Pi's exact CubOS (cbc33dc + all three local patches):
#   validate_setup   PASS, 12 steps
#   run_protocol --mock   12/12
#   passive_shadow        0 interferences
#   passive_shadow --tip-stuck   0 interferences
#
# ---------------------------------------------------------------------------
# Why it did not run
# ---------------------------------------------------------------------------
# Nothing in these three files. `OpentronsPipette.connect()` sees the
# firmware's `homed: 0`, calls `home()`, and both legs of home()'s built-in
# retry return ERR:{"error":"Failed to home pipette"} after 26.35 s each. The
# driver then closes the port and raises PipetteConnectionError, which happens
# before the gantry is homed -- 0 steps, no motion.
#
# The plunger DIRECTION fault from 2026-08-31 is fixed (retractions now move,
# and round-trip time scales with distance both ways). The limit switch is the
# new and only blocker.
#

positions:
  park_position: [206.0, 100.0, 100.0]
  pipette_park:  [258.0, 182.0, 87.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 100

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -35.0
  - move: 
      instrument: pipette
      position: pipette_park
      travel_z: 87



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -35.0

  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

#   # --- vial 3 ---
#   - decap:
#       instrument: vial_capper_decapper
#       vial: vial_3

#   - cap:
#       instrument: vial_capper_decapper
#       vial: vial_3

#   # --- vial 4 ---
#   - decap:
#       instrument: vial_capper_decapper
#       vial: vial_4

#   - cap:
#       instrument: vial_capper_decapper
#       vial: vial_4

#   # --- vial 5 ---
#   - decap:
#       instrument: vial_capper_decapper
#       vial: vial_5

#   - cap:
#       instrument: vial_capper_decapper
#       vial: vial_5


  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
