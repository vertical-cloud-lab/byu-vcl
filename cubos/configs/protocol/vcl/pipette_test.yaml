# pipette_test.yaml -- SHORTENED rev: decap vial_1, pick up a tip, aspirate in
# vial_1, park the pipette, recap vial_1, decap vial_2, blow out into vial_2,
# drop the tip, cap vial_2, home. CubXL, 2026-09-01 rev 3.
#
# Attached to PR #171 on 2026-09-01 after Ben's fourth rewiring pass. THE BODY
# BELOW IS BEN'S, VERBATIM (parsed YAML verified identical to the attachment).
#
# *** RAN ON HARDWARE: campaign 77, 2026-09-01 19:50:49 -> 19:54:52 UTC,     ***
# *** 12/12 steps, status `completed`. No capper retries, no alarms.        ***
# *** See ../../../results/pipette_test_20260901e/README.md.                ***
#
# Changes vs. the rev that ran as campaign 73 (commit 44f1d27):
#   positions.park_position  [206.0, 100.0, 100.0] -> [206.0, 25.0, 115.0]
#   step 1 move  travel_z    100 -> 115
#
# ---------------------------------------------------------------------------
# park_position [206, 100, 100] -> [206, 25, 115]
# ---------------------------------------------------------------------------
# This is the protocol's OWN named position for step 1 (the capper's first move
# out of the homed corner), not the capper's `park_position` in the gantry
# file, which is unchanged at [236, 175] and is what decap/cap use.
#
# Deck (206, 25) sits essentially on vial_1 (centre Y 27), so step 1 is now the
# approach to the vial it is about to decap rather than a detour. travel_z 115
# names the capper, so it resolves to gantry 115 - 15.935 = 99.065 -- the same
# plane every other capper leg rides, instead of the 84.065 that travel_z 100
# gave. Confirmed in this run's G-code: the first three moves are
#   G01 Z99.065 / G01 X206.0 / G01 Y25.0
# Cap tops are at deck 70, so the transit clears them by 45 mm.
#
# passive_shadow: 0 interferences nominal AND 0 with the tip modeled as stuck.
#
# ---------------------------------------------------------------------------
# height: -35.0 -- unchanged, and it clears
# ---------------------------------------------------------------------------
# `height` is a labware-relative offset from the vial RIM, and an engage
# descends the moving instrument's TOOL POINT to `location.z + height`. With a
# 35 mm tip attached the tool point is the tip end, so:
#
#   vial rim (location.z)                       deck Z  55.0
#   + height                                          -35.0
#   = tip end                                   deck Z  20.0   -> gantry Z 55.0
#   nozzle (tip end + tip_length 35)            deck Z  55.0   == the rim
#
# CubOS documents a vial's `height` as the OUTER height, rim -> underside, so
# `height: 83` with the rim at deck 55 puts the underside at deck -28 and the
# tip end has ~45 mm of clearance to the floor.
#
# ---------------------------------------------------------------------------
# Geometry, as commanded (this run's own G-code)
# ---------------------------------------------------------------------------
#   step 1 capper park, travel_z 115        gantry Z  99.065
#   capper transit / park at safe_z 115     gantry Z  99.065
#   capper engage (rim 55 + engage 15)      gantry Z  54.065
#   bare-nozzle hover at safe_z 115         gantry Z 115.0
#   pick_up_tip tip_rack.A1                 gantry   (284.0, 25.5, 57.0)
#   tipped hover, CLAMPED by the patch      gantry Z 124.0
#   aspirate vial_1 / blowout vial_2        gantry Z  55.0    <- tip end deck 20
#   step 5 pipette_park, travel_z 87        gantry Z 122.0
#   drop_tip tip_rack.A1                    gantry Z  92.0
#
# Offline gates, on the Pi's exact CubOS (cbc33dc + all four local patches):
#   validate_setup   PASS, 12 steps
#   run_protocol --mock   12/12
#   passive_shadow        0 interferences
#   passive_shadow --tip-stuck   0 interferences
#
# ---------------------------------------------------------------------------
# PLUNGER: half the commands were refused by the firmware, not by CubOS
# ---------------------------------------------------------------------------
# The pipette limit switch reads ASSERTED (Arduino D9 HIGH). In
# BU-KABlab/PANDA_Arduino src/Pipette.cpp, stepMotor() aborts a move when
#   digitalRead(PIPETTE_LIMIT_PIN) == HIGH && digitalRead(DIR_PIN) == LOW
# i.e. any UP/retract move, after 1 step + the 100 ms debounce. So in this run
# `pick_up_tip`, `blowout` and both `drop_tip` legs each returned OK in ~0.11 s
# having emitted no steps, while the forward `prime` and `aspirate` stepped
# normally. Nothing in this protocol can work around that; it is one input pin.
#

positions:
  park_position: [206.0, 25.0, 115.0]
  pipette_park:  [258.0, 182.0, 87.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 115

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -35.0
  - move: 
      instrument: pipette
      position: pipette_park
      travel_z: 87



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -35.0

  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

