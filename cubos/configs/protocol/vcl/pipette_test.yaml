# pipette_test.yaml -- decap vial_1, pick up a tip, aspirate in vial_1, park
# the pipette, recap vial_1, decap vial_2, blow out into vial_2, drop the tip,
# then decap+cap vials 2..5. CubXL, 2026-08-31 rev 2.
#
# Attached to PR #171 on 2026-08-31. THE BODY BELOW IS BEN'S, VERBATIM.
# NOT RUN -- Ben asked for the bench test only, no protocols.
#
# *** AS ATTACHED THIS TRIO FAILS VALIDATION. One number, one line. ***
#
# ---------------------------------------------------------------------------
# The blocker: pipette_park / travel_z 100 with a tip on = gantry 135
# ---------------------------------------------------------------------------
#   RESULT: FAIL - 4 violation(s) found
#   - pipette -> pipette_park.location.target:  gantry (206.0, 170.0, 135.0)
#       violates z_max=124.0
#   - pipette -> pipette_park.location.travel_z: gantry (206.0, 170.0, 135.0)
#       violates z_max=124.0
#   - step 5 (move): move target 'pipette_park' gantry z=135.0 is outside
#       working volume [0.0, 124.0] for instrument 'pipette'.
#   - step 5 (move): move travel_z for 'pipette_park' gantry z=135.0 ...
#
# travel_z and a named position are both resolved IN THE MOVING INSTRUMENT'S
# TOOL FRAME. Step 1 names the capper, so its 100 -> gantry 100 - 15.935 =
# 84.065, fine. Step 5 names the pipette WITH A 35 mm TIP ATTACHED, so its
# 100 -> gantry 100 + 35 = 135, which is 11 mm past z_max 124.
#
# The hover-clamp patch does NOT rescue this and is not meant to: it clamps
# an unreachable *hover* (an engage command's implicit safe_z travel, which
# you cannot otherwise influence). An explicit `move` target you wrote by
# hand stays a hard requirement -- silently lowering it would be the wrong
# behaviour for a coordinate the protocol author chose.
#
# ---------------------------------------------------------------------------
# The fix: 100 -> 89 in the two places that name the pipette
# ---------------------------------------------------------------------------
#   positions.pipette_park:  [258.0, 182.0, 100.0]  ->  [258.0, 182.0, 89.0]
#   step 5 (move: instrument: pipette) travel_z: 100  ->  89
#
# 89 = z_max 124 - tip 35, the highest a tipped pipette can be commanded, and
# it is exactly the plane the hover clamp picks for aspirate/blowout/drop_tip
# -- so the whole tipped phase rides one consistent height. Tip end at deck
# 89 clears the cap tops (70) by 19 mm. Leave step 1's travel_z at 100: it
# names the capper and the nozzle is still bare there.
#
# With only that change, on the Pi's CubOS (cbc33dc + all three patches):
#     validate_setup                 PASS, 18 steps
#     run_protocol --mock            18/18
#     passive_shadow                 0 interferences
#     passive_shadow --tip-stuck     0 interferences   <-- first time ever
#
# The corrected copy lives at ../../results/pipette_bench_20260831/ and the
# body here is left as Ben sent it, on purpose, so the diff is his to make.
#
# ---------------------------------------------------------------------------
# Commanded geometry once corrected (from the coordinate trace)
# ---------------------------------------------------------------------------
#   capper transit / park           gantry  99.065   (safe_z 115 - 15.935)
#   capper engage over a vial       gantry  54.065   (rim 55 + engage 15)
#   bare-nozzle hover, tip rack     gantry 115.000
#   pick_up_tip tip_rack.A1         gantry (314.0, 25.5, 57.0)
#   tipped hover (CLAMPED)          gantry 124.000   (tip end deck 89)
#   aspirate vial_1 / blowout v2    gantry  75.000   (tip end 15 mm in)
#   drop_tip tip_rack.A1            gantry  92.000   (see the deck header)
#
# ---------------------------------------------------------------------------
# What will still not work, and it is not this file's fault
# ---------------------------------------------------------------------------
# aspirate WILL actuate the plunger; blowout and drop_tip will NOT. The
# firmware's MOVE_TO only executes when the target is above the current
# plunger position, and ASPIRATE leaves it at pos 36, above every later
# target. Bench evidence and the full command matrix are in
# ../../results/pipette_bench_20260831/README.md. Fix the plunger direction
# before reading anything into a liquid result from this protocol.
#
# Config trio:
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper.yaml   (2026-08-31 rev 2)
#   deck:     ../../deck/ben_6vials_tiprack.yaml            (2026-08-31 rev 2)
#   protocol: this file
#
#   python -m cubos.tools.validate_setup      <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock <gantry> <deck> <protocol>
#   python -m cubos.tools.passive_shadow      <gantry> <deck> <protocol>

positions:
  park_position: [206.0, 170.0, 100.0]
  pipette_park:  [258.0, 182.0, 100.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 100

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -15.0
  - move: 
      instrument: pipette
      position: pipette_park
      travel_z: 100



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -15.0

  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5


  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
