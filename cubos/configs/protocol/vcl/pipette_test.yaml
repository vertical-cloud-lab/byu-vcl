# pipette_test.yaml -- decap vial_1, pick up a tip, aspirate in vial_1, recap
# vial_1, decap vial_2, blow out into vial_2, drop the tip, then decap+cap
# vials 2..5. CubXL, 2026-08-27/28 recalibration.
#
# Attached to PR #171 on 2026-08-31. THE BODY BELOW IS BEN'S, VERBATIM --
# parsed YAML verified identical to the attachment. Only this header was
# replaced (the previous one described substitutions that are no longer
# true, see below).
#
# *** RAN ON HARDWARE 2026-08-31: 18/18 steps, 4m 39s, status `completed`,
# *** campaign 33. No retries, no warnings, no alarms. First run in which
# *** the pipette's own aspirate/blowout/drop_tip commands executed.
#
# Config trio (all three as run):
#   gantry:   ../../gantry/cub_xl_ben_pipette_capper.yaml   (2026-08-31 rev)
#   deck:     ../../deck/ben_6vials_tiprack.yaml            (2026-08-31 rev)
#   protocol: this file
#
#   python -m cubos.tools.validate_setup      <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol --mock <gantry> <deck> <protocol>
#   python -m cubos.tools.passive_shadow      <gantry> <deck> <protocol>
#   python -m cubos.tools.run_protocol        <gantry> <deck> <protocol>
#
# ---------------------------------------------------------------------------
# WHAT CHANGED vs. the 2026-08-28 rev-2, and why it now works
# ---------------------------------------------------------------------------
# Only one thing: vial_6's decap/cap pair was removed (Ben, 2026-08-31). The
# rest of the file is the corrected rev-2. Two earlier corrections are what
# made this runnable, and both are load-bearing:
#
#   * Step 5's retract names `instrument: pipette`, not the capper. travel_z
#     is applied in the MOVING instrument's tool frame (instrument_mount.py:
#     71, gantry_travel_z = travel_z + depth). Named to the capper, travel_z
#     87 resolves to gantry 71.065 -- BELOW the gantry 75 the head is already
#     at after aspirate -- so the step lowered 3.9 mm and then translated X,
#     shearing the tip sideways through vial_1's neck 19 mm under the rim.
#     Named to the pipette it resolves to 87 + 35 = gantry 122 and the tip
#     lifts clear before any XY motion.
#   * The gantry's capper park_position is [206, 50], on the vial column's
#     own X, so every decap/cap leg is a pure-Y move. See that file's header.
#
# There is no longer any reason to substitute primitives for `mix`/`drop_tip`
# as the 2026-08-25 rev did: at safe_z 87 the tipped hover is gantry 122,
# exactly z_max, so the real engage commands validate AND run. The pipette is
# also `offline: false` now, so the plunger and ejector actually fire.
#
# ---------------------------------------------------------------------------
# COMMANDED GANTRY COORDINATES (verified in mock, reproduced on hardware)
# ---------------------------------------------------------------------------
#   capper transit / park      z 71.065   (safe_z 87 + depth -15.935)
#   capper engage over a vial  z 52.065   (rim 55 + engage_depth_mm 13, -15.935)
#   pick_up_tip tip_rack.A1    (284.000, 25.500, 60.000)  <- Ben's measured jog
#   tipped hover               z 122.000  (safe_z 87 + tip 35 = z_max exactly)
#   aspirate vial_1            (154.000,  15.000,  75.000) tip end 15 mm in
#   blowout  vial_2            (154.000,  48.000,  75.000) tip end 15 mm in
#   drop_tip tip_rack.A1       (284.000,  25.500,  95.000)  <- see below
#   every capper pose          x = 206.000 (pure-Y legs, pipette held at 258)
#
# ---------------------------------------------------------------------------
# KNOWN, UNRESOLVED: drop_tip releases the tip 35 mm above the slot
# ---------------------------------------------------------------------------
# drop_tip engages like any pipette command -- it descends the TOOL POINT,
# which with a tip on is the tip END, to the rack's location.z 60, i.e.
# gantry 95. A tip seated in A1 has its end at deck 25 (nozzle at 60, tip
# 35 long). So the ejector fires one full tip-length above the slot and the
# tip falls. It will not seat back in A1. Ben's standing instruction from
# 2026-08-28 is not to gate the run on this -- he watches the machine and
# removes the tip by hand if needed -- so the run proceeds, but nothing in
# software confirms the outcome: commands/pipette.py calls
# clear_attached_tip_extension() unconditionally, so from step 10 on CubOS
# plans in the bare-nozzle frame whatever physically happened.
#
# If the tip is still on at step 10, its end rides the capper legs at deck
# Z 36.065 and passive_shadow --tip-stuck reports 3 interferences, all into
# the tip rack. Steps 9 and 10 are back to back, so there is no window to
# intervene; a `breakpoint:` between them would create one, but ONLY from a
# foreground terminal (headless runs log "Breakpoint skipped because stdin is
# not interactive" and continue straight into that motion).
#
# The real fix is a `tip_disposal` deck entry -- that is what drop_tip is
# meant to target, and it ejects at THAT entry's own location.z -- plus a
# measured drop_tip_position (models.py has it as `10.0  # placeholder`).
# Neither is a change to this file.
#
# ---------------------------------------------------------------------------
# EYEBALL BEFORE RE-RUNNING (no offline check models the PASSIVE instrument;
# passive_shadow does, but only against labware that is in the deck file)
# ---------------------------------------------------------------------------
#   * Bare nozzle during capper engages: deck (258, vial_y + 12) at Z 52.065.
#   * Capper head during the tip pickup: deck (284, 25.5) down to Z 44.065.
#   * Nominal sweep is clean (0 interferences). Holders, brackets and cabling
#     are not in the deck file and are not modeled.
positions:
  park_position: [206.0, 170.0, 87.0]
  pipette_park:  [258.0, 182.0, 87.0]

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 87

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  - aspirate:
      position: vial_1
      volume_ul: 20.0
      height: -15.0
  - move: 
      instrument: pipette
      position: pipette_park
      travel_z: 87



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  - blowout:
      position: vial_2
      height: -15.0

  - drop_tip:
        position: tip_rack.A1


  - cap:
      instrument: vial_capper_decapper
      vial: vial_2

  # --- vial 3 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_3

  - cap:
      instrument: vial_capper_decapper
      vial: vial_3

  # --- vial 4 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_4

  - cap:
      instrument: vial_capper_decapper
      vial: vial_4

  # --- vial 5 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_5

  - cap:
      instrument: vial_capper_decapper
      vial: vial_5


  # Modeled with the tip still attached (nothing runnable clears it); the
  # home pose validates in-bounds, and the nozzle is physically bare by now.
  - home:
