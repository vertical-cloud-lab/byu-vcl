      travel_z: 111.0
  - pause:
      seconds: 1.0
      reason: "lap 10/10 complete"

  # --- Park at the deck centre (still pure XY at Z 111), then home.
  - move:
      instrument: pipette
      position: deck_center
      travel_z: 111.0

  - home:
