  # --- Lap 8 of 10
  - move:
      instrument: pipette
      position: square_front_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_left
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_front_left
      travel_z: 111.0
  - pause:
      seconds: 1.0
      reason: "lap 8/10 complete"

  # --- Lap 9 of 10
  - move:
      instrument: pipette
      position: square_front_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_left
      travel_z: 111.0
