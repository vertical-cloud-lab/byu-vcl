  # --- Lap 10 of 10
  - move:
      instrument: pipette
      position: square_front_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_right
      travel_z: 111.0
  - move:
      instrument: pipette
      position: square_back_left
      travel_z: 111.0
