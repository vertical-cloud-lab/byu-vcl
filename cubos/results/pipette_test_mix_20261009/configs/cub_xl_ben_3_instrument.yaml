# cub_xl_ben_3_instrument.yaml -- CubXL, @benwhitney5463's 2026-10-02 rev: the
# machine recalibrated again, capper + pipette + a mount-only camera.
#
# Attached to issue #169 on 2026-10-02 at 19:54Z, replacing his 19:35Z
# attachment. THE BODY BELOW IS BEN'S, VERBATIM (parsed YAML identical to the
# attachment; only CRLF -> LF).
#
# Changes vs. the 19:35Z attachment (previous rev of this file):
#   factory_z_travel_mm              125.0  ->  124.0
#   working_volume x / y / z max     already 361 / 278 / 122 in Ben's file now.
#     The previous rev lowered Ben's 364 / 281 / 125 to these by hand: z_max is
#     the plane every XY travel rides (CubOS multi_tool_safe_travel_z), and
#     125 = $132 is where the Z switch trips during homing, with hard limits on
#     ($21=1). 122 = max_travel - the 3 mm pull-off is the homed pose.
# Everything else is unchanged: GRBL max_travel 364 / 281 / 125, capper offset
# (0, 0) depth -16, pipette offset (55.0, 11.0), camera_3 (-40, 10) depth -110.

serial_port: /dev/ttyUSB0
gantry_type: cub_xl
cnc:
  factory_z_travel_mm: 124.0
  calibration_block_height_mm: 35.0
  y_axis_motion: head
  safe_z: 115.0
working_volume:
  x_min: 0.0
  x_max: 361.0
  y_min: 0.0
  y_max: 278.0
  z_min: 0.0
  z_max: 122.0
origin_policy: deck_origin
grbl_settings:
  dir_invert_mask: 1
  status_report: 0
  soft_limits: true
  homing_enable: true
  homing_dir_mask: 0
  homing_pull_off: 3.0
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 364.0
  max_travel_y: 281.0
  max_travel_z: 125.0
instruments:
  vial_capper_decapper:
    type: capper
    vendor: pawduino
    offset_x: 0.0
    offset_y: 0.0
    depth: -16.0
    capture_retries: 2
    capture_settle_s: 1
    engage_depth_mm: 15
    offline: false
    park_position:
    - 236
    - 25
    port: /dev/ttyACM0
  pipette:
    type: pipette
    vendor: opentrons
    offset_x: 55.0
    offset_y: 11.0
    depth: 0.0
    pipette_model: p20_single_gen2
    port: /dev/ttyACM0
    offline: false
  camera_3:
    type: camera
    vendor: mount_only
    offset_x: -40.0
    offset_y: 10.0
    depth: -110.0
