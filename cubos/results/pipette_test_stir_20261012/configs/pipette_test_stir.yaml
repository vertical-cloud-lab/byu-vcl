# pipette_test_stir.yaml -- pipette_test_mix.yaml with step 8's `mix` in vial_2
# replaced by moves that stir with the tip. @benwhitney5463 asked for it on PR
# #269, 2026-10-12 18:3xZ: "switch the mix action with a series of moves to
# stir around in vial 2 ... the inner diameter of the vial is 21mm, and the tip
# starts at the center." Every other step, position and comment below is
# pipette_test_mix.yaml's, verbatim, so step 4 still mixes in vial_1.
#
# The stir block is generated by cubos/tools/stir_moves.py:
#   python cubos/tools/stir_moves.py --x 136.668 --y 78 --z 21 --r-max 5
# vial_2's centre in the pipette frame is deck (136.668, 78), gantry (81.668,
# 67). Tip end at deck Z 21 = rim 56 - 35, the plane the 10-09 mix used, so
# gantry Z 56 throughout.
#
# How a stir step moves. A raw `move` whose travel_z equals its own target Z
# sends no Z at all, and the driver sends X and Y as separate G01s (X first),
# each at F3000, each waiting for Idle. Every step below changes one axis
# only, so each is exactly one G01 and the tip never takes an unplanned
# corner. GRBL accel is 300 mm/s^2 on all axes, so a 7 mm side peaks at
# ~46 mm/s and a 10 mm stroke at 50 mm/s (the F3000 cap), and every step
# starts and ends at rest.
#
# Clearance. r_max = 5 mm: no point of the path is more than 5 mm from the
# centre (square corners at (+-3.5, +-3.5), 4.95 mm). In a 21 mm ID that leaves
# 5.5 mm to the wall from the tip's axis. The part of the tip inside the vial
# is at most ~3.3 mm across (the collar is above the nozzle end, which is at
# the rim plane), so ~3.8 mm of glass clearance at the worst point, for any
# centring error and tip run-out.
#
# Path: 5 square laps counter-clockwise, 5 clockwise, 4 round trips along X
# through the centre, 4 along Y, back to the centre, then straight up. 63
# moves in all (61 stirring), ~0.5 s each if CubOS's per-command overhead is
# the ~0.1-0.2 s seen on 10-09.
#
# Plunger. Untouched in step 8: it stays where step 4's last DISPENSE left it
# (32.5 mm, blowout), so the tip carries nothing in or out of vial_2.

positions:
  park_position: [206.0, 25.0, 115.0]
  pipette_park:  [258.0, 25.0, 86.0]   # CHANGED 2026-09-08 (was 182.0):
                                       # Ben moved both parks to the near-Y
                                       # end of the deck. Pipette frame, so
                                       # gantry (206, 13, 122).

protocol:
  - home:

  # 1. Park the pipette first (base-protocol convention): explicit travel_z
  #    so the transit out of the homed corner is modeled, well away from the
  #    vial column and the tip rack.
  - move:
      instrument: vial_capper_decapper
      position: park_position
      travel_z: 115

  # 2. Open vial_1 while the nozzle is still bare.
  - decap:
      instrument: vial_capper_decapper
      vial: vial_1

  - pick_up_tip:
      position: tip_rack.A1

  # 4. CHANGED: mix in vial_1, was `aspirate` 20 uL.
  - mix:
      position: vial_1
      volume_ul: 20.0
      cycles: 3
      height: -35.0
  - move: 
      instrument: pipette
      position: pipette_park
      travel_z: 86



  # 6. Close vial_1, then decap+cap the remaining five vials (no pipette
  #    insertion -- see TIP-ON INVARIANT in the header for why none can
  #    honestly follow the hand removal).
  - cap:
      instrument: vial_capper_decapper
      vial: vial_1

  # --- vial 2 ---
  - decap:
      instrument: vial_capper_decapper
      vial: vial_2

  # 8. CHANGED: stir in vial_2 with the tip, was `mix` (and `blowout` before
  #    that). Into the vial at its centre: the same Z122 / X81.668 / Y67.0 /
  #    Z56.0 the mix's engage sent.
  - move: {instrument: pipette, position: [136.668, 78.0, 21.0], travel_z: 87.0}
  # square entry
