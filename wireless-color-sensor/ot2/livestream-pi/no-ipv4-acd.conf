[connection]
# Turn off IPv4 address conflict detection (ACD, RFC 5227). The campus Wi-Fi
# sends ARP packets claiming this Pi's own address from MAC 00:00:00:00:00:00.
# NetworkManager takes them as a conflict and, at a later DHCP renewal, drops
# the address and default route. The Pi then stays offline until its lease runs
# out, ~50 min later. See vertical-cloud-lab/streamingLambda#9.
ipv4.dad-timeout=0
