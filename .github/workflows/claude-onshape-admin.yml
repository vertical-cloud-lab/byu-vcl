name: Claude Code (Onshape admin)

# A separate, deliberately small workflow for anything that needs the lab's
# Onshape ADMIN account (company membership, sharing and permissions, making
# documents public). Plain @claude runs only get the member account; see the
# Onshape section of CLAUDE.md.
#
# Three gates, any one of which stops a run:
#   1. The `if:` below: only @claude-onshape-admin, and only from sgbaird.
#   2. The `onshape-admin` environment requires a member of the
#      vertical-cloud-lab/onshape-admin-approvers team (sgbaird only) to approve
#      every run (Actions tab -> the waiting run -> Review deployments). This is
#      the gate that holds even if someone edits this file, since main is
#      unprotected. Admins can't bypass it.
#   3. That environment only deploys from main, so a workflow pushed on any
#      other branch cannot read its secrets.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude-onshape-admin:
    if: |
      github.actor == 'sgbaird' && (
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude-onshape-admin')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-onshape-admin') || contains(github.event.issue.title, '@claude-onshape-admin')))
      )
    runs-on: ubuntu-latest
    environment: onshape-admin
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same ephemeral tailnet join as claude.yml. Onshape's sign-in goes through
      # an SSH SOCKS tunnel to the CubXL Pi, so Onshape sees the BYU network
      # rather than a datacenter. The OAuth client must request BOTH tags or the
      # join fails outright; see the Tailscale section of CLAUDE.md.
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:stream-cam-test,tag:rpi-5-des4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment secrets (onshape-admin): the Onshape admin account login.
          ONSHAPE_ADMIN_USERNAME: ${{ secrets.ONSHAPE_ADMIN_USERNAME }}
          ONSHAPE_ADMIN_PASSWORD: ${{ secrets.ONSHAPE_ADMIN_PASSWORD }}
          # Repo secrets: the member account and the REST API key pair, the same
          # ones every @claude run gets.
          ONSHAPE_USERNAME: ${{ secrets.ONSHAPE_USERNAME }}
          ONSHAPE_PASSWORD: ${{ secrets.ONSHAPE_PASSWORD }}
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
          # The CubXL Pi, which the browser's SOCKS tunnel goes through. Variables,
          # not secrets: see the masking note in CLAUDE.md.
          CUBXL_PI_USERNAME: ${{ vars.CUBXL_PI_USERNAME }}
          CUBXL_PI_HOSTNAME: ${{ vars.CUBXL_PI_HOSTNAME }}
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-onshape-admin"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5 --effort max
            --permission-mode bypassPermissions
