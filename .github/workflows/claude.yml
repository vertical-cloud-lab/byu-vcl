name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Model policy lives here, in one place.
env:
  # Model a bare @claude runs on. "claude-opus" is passed to the CLI as the
  # alias "opus", i.e. the latest Opus. Change this one line to move it.
  PRIMARY_MODEL: claude-opus
  # Model to retry with when the first attempt dies on an exhausted allowance
  # (an expired usage limit or a spent credit balance). Set to "" to switch the
  # retry off. If it names the same model as the primary, for example
  # "@claude+opus-5" with a claude-opus-5 fallback, the retry is skipped: that
  # allowance is already spent, so a second attempt on it would just fail again.
  FALLBACK_MODEL: claude-opus
  # Effort used when the tag carries no :effort suffix.
  DEFAULT_EFFORT: max
  # "true" retries on ANY first-attempt failure, not only an exhausted
  # allowance. That costs a second full session every time Claude errors out,
  # so it is off by default.
  RETRY_ON_ANY_FAILURE: "false"
  # Seats "Pick a seat from the token pool" may use, each a secret named
  # CLAUDE_TOKEN_<NAME>; runs rotate across them by run number. A new seat
  # needs its name here AND a TOK_<NAME> line in both pick steps below.
  CLAUDE_TOKEN_POOL: "STERLING MONGOOSE ELEPHANT DOLPHIN GOSHAWK HEDGEHOG MEERKAT MOOSE NEWT PANTHER PARROT OTTER FALCON"
  # Seats tried before the rest of the pool, in this order. Empty: none.
  CLAUDE_TOKEN_PREFERRED: ""

jobs:
  claude:
    # The sender.type clause skips runs fired by bot-authored comments and
    # issues (for example claude[bot]'s own tracking comments, which fired
    # 150 of this workflow's last 400 runs). It is cost control, not the
    # security boundary: the action refuses bot actors on its own before any
    # session starts. See "Why the write grant cannot make the job trigger
    # itself" in
    # https://github.com/ME-EN-372/me-en-372-machine-design-private/blob/main/docs/claude-yml-model-fallback.md.
    if: |
      (github.event.sender.type != 'Bot' || github.event.sender.login == 'vcl-bot[bot]') &&
      ((
         (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
         (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
         (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
         (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
       ) &&
       !contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude-youtube') &&
       !contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude-print') &&
       !contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude-onshape-admin') &&
       !contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude-super'))
    runs-on: ubuntu-latest
    # Allow long waits (e.g., Edison polling) without hitting a job-level limit.
    # This budget now covers both attempts, so a fallback after a long first
    # attempt gets whatever is left of the 180 minutes.
    timeout-minutes: 360
    permissions:
      contents: read
      # Write, not read, so the "Explain the failure" step can edit the first
      # attempt's comment when the retry fires. PR conversation comments and
      # review-thread replies fall under pull-requests, plain issue comments
      # under issues. Claude's own comments go through the action's app token,
      # which these do not touch.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    # Secrets sit at job level rather than on the action step, because the job
    # now runs the action twice and a step-level block would have to be kept in
    # sync in two places. Every step inherits these, and the action passes its
    # environment through to the Claude CLI.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EDISON_PLATFORM_API_KEY: ${{ secrets.EDISON_PLATFORM_API_KEY }}
      # Read-only access to the sgbaird/agent-staging drop box, for files staged
      # from other repos (see CLAUDE.md, "Receiving files from other repos").
      GH_READ_PAT_STAGING: ${{ secrets.GH_READ_PAT_STAGING }}
      TAILNET_ID: ${{ secrets.TAILNET_ID }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      RPI_STREAM_CAM_HOSTNAME: ${{ secrets.RPI_STREAM_CAM_HOSTNAME }}
      RPI_STREAM_CAM_PASSWORD: ${{ secrets.RPI_STREAM_CAM_PASSWORD }}
      OT2_STREAM_CAM_HOSTNAME: ${{ secrets.OT2_STREAM_CAM_HOSTNAME }}
      OT2_STREAM_CAM_PASSWORD: ${{ secrets.OT2_STREAM_CAM_PASSWORD }}
      # The Pi 5 that fronts the CubXL. Its own sudo password, separate from
      # the stream-cam Pis. Hostname is a variable, not a secret: a tailnet
      # name grants nothing on its own, and it already appears in the
      # tag name on the Tailscale step above.
      CUBXL_PI_PASSWORD: ${{ secrets.CUBXL_PI_PASSWORD }}
      # Usernames are repo *variables*, not secrets: one value is 3 characters,
      # and GitHub masks a short secret everywhere it appears as a substring —
      # it rewrote "byu-vcl" to "byu-***" throughout the logs. Set the values
      # under Settings → Secrets and variables → Actions → Variables.
      RPI_STREAM_CAM_USERNAME: ${{ vars.RPI_STREAM_CAM_USERNAME }}
      OT2_STREAM_CAM_USERNAME: ${{ vars.OT2_STREAM_CAM_USERNAME }}
      CUBXL_PI_USERNAME: ${{ vars.CUBXL_PI_USERNAME }}
      CUBXL_PI_HOSTNAME: ${{ vars.CUBXL_PI_HOSTNAME }}
      HEALTHCHECKS_IO_URL: ${{ secrets.HEALTHCHECKS_IO_URL }}
      AIRGRADIENT_API_KEY: ${{ secrets.AIRGRADIENT_API_KEY }}
      ONEDRIVE_EDIT_LINK_PASSWORD: ${{ secrets.ONEDRIVE_EDIT_LINK_PASSWORD }}
      # MongoDB Atlas — org "Vertical Cloud Lab @ BYU", project byu-vcl, cluster alloy.
      # MONGODB_BLINDED_URI keeps the literal <db_password> placeholder, matching the
      # `blinded_connection_string` convention used by the OT-2-LCM Hugging Face Space.
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_BLINDED_URI: ${{ secrets.MONGODB_BLINDED_URI }}
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      # HiveMQ Cloud (free Serverless). MQTT_USERNAME/PASSWORD is the `vcl-agent`
      # credential, meant for CI and debugging; the per-device credentials below are
      # separate so any one of them can be rotated without disturbing the others.
      MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_WEBSOCKET_PORT: ${{ secrets.MQTT_WEBSOCKET_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_PICOW_USERNAME: ${{ secrets.MQTT_PICOW_USERNAME }}
      MQTT_PICOW_PASSWORD: ${{ secrets.MQTT_PICOW_PASSWORD }}
      MQTT_HF_SPACE_USERNAME: ${{ secrets.MQTT_HF_SPACE_USERNAME }}
      MQTT_HF_SPACE_PASSWORD: ${{ secrets.MQTT_HF_SPACE_PASSWORD }}
      MQTT_OT2_USERNAME: ${{ secrets.MQTT_OT2_USERNAME }}
      MQTT_OT2_PASSWORD: ${{ secrets.MQTT_OT2_PASSWORD }}
      # Hugging Face (byu-vcl account) and Zenodo (deposit:write + deposit:actions)
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
      # BYU Vertical Cloud Lab YouTube channel, upload + read ONLY (cannot
      # delete or edit). Full control lives in the youtube-admin environment,
      # reachable only through @claude-youtube. See youtube/README.md.
      YOUTUBE_UPLOAD_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_UPLOAD_TOKEN_PICKLE_B64 }}
      # Onshape REST API key pair (dev-portal.onshape.com), same pair as tensegrity-optimization
      ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
      ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
      # The lab's shared Onshape account (member privileges), for browser sign-in. The admin
      # account is reachable only through @claude-onshape-admin. See CLAUDE.md.
      ONSHAPE_USERNAME: ${{ secrets.ONSHAPE_USERNAME }}
      ONSHAPE_PASSWORD: ${{ secrets.ONSHAPE_PASSWORD }}
      # OT-2 robot serial, read from the robot's own /health endpoint. Namespaces the
      # command/ot2/<serial>/pipette and status/ot2/<serial>/complete MQTT topics.
      OT2_SERIAL: ${{ secrets.OT2_SERIAL }}
      # Pico W machine.unique_id(), read off the board. Namespaces the
      # command/picow/<id>/as7341/read and color-mixing/picow/<id>/as7341 topics.
      PICO_ID: ${{ secrets.PICO_ID }}
      # Bambu Lab printers (H2D and A1 mini), LAN-mode IP, access code and serial.
      # The IPs are on the lab LAN, not the tailnet, so reach them from a Pi.
      H2D_IP: ${{ secrets.H2D_IP }}
      H2D_ACCESS_CODE: ${{ secrets.H2D_ACCESS_CODE }}
      H2D_SERIAL: ${{ secrets.H2D_SERIAL }}
      A1_MINI_IP: ${{ secrets.A1_MINI_IP }}
      A1_MINI_ACCESS_CODE: ${{ secrets.A1_MINI_ACCESS_CODE }}
      A1_MINI_SERIAL: ${{ secrets.A1_MINI_SERIAL }}
      # No Bambu Lab cloud login here: it lives in the bambu-print environment,
      # reachable only through @claude-print (claude-print.yml), with each run
      # approved by a member of bambu-print-approvers. See CLAUDE.md.
      # Windows login for the EZstat Pro's PC (#231), Remote Desktop to
      # 192.168.231.10. Runners get no tailnet grant to it, so connect from
      # the CubXL Pi, which is cabled to it (see CLAUDE.md)
      POTENTIOSTAT_PC_USERNAME: ${{ secrets.POTENTIOSTAT_PC_USERNAME }}
      POTENTIOSTAT_PC_PASSWORD: ${{ secrets.POTENTIOSTAT_PC_PASSWORD }}
      # Allow long-blocking foreground commands (e.g., Edison polling)
      BASH_DEFAULT_TIMEOUT_MS: "900000" # 15 min default per Bash call
      BASH_MAX_TIMEOUT_MS: "3600000" # 60 min ceiling per Bash call

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # all history, all branches
          filter: blob:none     # ...without historical blobs (i.e., low total size)


      # Join the tailnet as an ephemeral node (auto-removed at job end) so sessions
      # never have to hand-roll `tailscale up` — the CLI can echo the raw OAuth
      # secret inline in its sticky-flag hint, which is the failure mode this step
      # removes. Access to the Pis is still bounded by tailnet ACLs, not by joining.
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Two tags: the stream-cam devices, and the Pi that fronts the CubXL.
          # The tailnet policy grants SSH within each tag, so the runner has to
          # carry a tag to reach that tag's devices. The OAuth client must be
          # authorized for BOTH or the join fails outright — see the Tailscale
          # section of CLAUDE.md before changing either side.
          tags: tag:stream-cam-test,tag:rpi-5-des4

      # Copilot-style model selector: @claude+<model>[:<effort>]
      # Examples: @claude, @claude+opus-5, @claude+opus-4.8:max, @claude:high
      # Model part: lowercased, dots to dashes, "claude-" prefixed if missing,
      # except a bare family name (opus, sonnet, fable) which is passed through
      # as a CLI alias for the latest model of that family.
      # Effort part: low | medium | high | xhigh | max.
      # The FULL tag is passed as the action's trigger phrase. That is required,
      # because the action only accepts whitespace or punctuation after the
      # phrase, not "+".
      - name: Parse model selector tag
        id: select
        env:
          TRIGGER_TEXT: ${{ github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          # First tag in the text wins
          TAG=$(grep -oiE '@claude(\+[a-z0-9.-]*[a-z0-9])?(:(low|medium|high|xhigh|max))?' <<<"$TRIGGER_TEXT" | head -n1)
          TAG=${TAG:-@claude}

          tag_lc=$(tr '[:upper:]' '[:lower:]' <<<"$TAG")
          rest=${tag_lc#@claude}
          effort=""
          if [[ "$rest" == *:* ]]; then
            effort=${rest##*:}
            rest=${rest%:*}
          fi
          model_part=${rest#+}

          # "opus-4.8" becomes claude-opus-4-8; a bare "opus" stays "opus", which
          # the CLI reads as an alias for the latest model of that family.
          resolve_model() {
            local p=${1,,}
            if [[ -z "$p" ]]; then
              printf ''
            elif [[ "$p" != *[0-9]* ]]; then
              printf '%s' "${p#claude-}"
            else
              local m=${p//./-}
              [[ "$m" == claude-* ]] || m="claude-$m"
              printf '%s' "$m"
            fi
          }

          # A bare @claude has no model part: resolve PRIMARY_MODEL too, so
          # "claude-opus" reaches the CLI as the alias "opus".
          model=$(resolve_model "${model_part:-$PRIMARY_MODEL}")
          fallback=$(resolve_model "$FALLBACK_MODEL")

          case "$effort" in
            low|medium|high|xhigh|max) ;;
            "") effort=$DEFAULT_EFFORT ;;
            *) echo "Ignoring unknown effort level ':$effort'; using $DEFAULT_EFFORT"
               effort=$DEFAULT_EFFORT ;;
          esac

          # "opus" and "claude-opus-5" name the same model, so compare with the
          # "claude-" prefix stripped and treat a bare family name as matching
          # any version of it.
          a=${model#claude-}
          b=${fallback#claude-}
          if [[ -z "$fallback" ]]; then
            echo "Fallback is off (FALLBACK_MODEL is empty)."
          elif [[ "$a" == "$b" || "$a" == "$b"-* || "$b" == "$a"-* ]]; then
            echo "Fallback $fallback is the same model as the primary ($model), so no retry will be attempted."
            fallback=""
          fi

          # --fallback-model is the CLI's own in-session switch. It covers an
          # overloaded or unavailable model, not an exhausted allowance, and it
          # keeps the session going instead of restarting it, so it is worth
          # having in addition to the job-level retry below.
          primary_args="--model $model --effort $effort"
          if [[ -n "$fallback" ]]; then
            primary_args="$primary_args --fallback-model $fallback"
          fi

          echo "Tag: $TAG -> $primary_args"
          if [[ -n "$fallback" ]]; then
            echo "If the allowance for $model is spent, the job retries with $fallback."
          fi

          echo "phrase=$TAG" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "fallback_model=$fallback" >> "$GITHUB_OUTPUT"
          echo "primary_args=$primary_args" >> "$GITHUB_OUTPUT"

      # Seat pool (load balancing). Each seat named in CLAUDE_TOKEN_POOL is a
      # secret CLAUDE_TOKEN_<NAME> holding one Team seat's `claude setup-token`. Seats in CLAUDE_TOKEN_PREFERRED
      # are tried first, then the rest, rotated by run number so concurrent
      # runs start on different seats. Each candidate gets a one-word probe on
      # this run's model, and a seat that answers with an error (usage limit,
      # invalid token) is skipped. Only seat names are logged; the values are
      # masked secrets. If no seat answers, CLAUDE_CODE_OAUTH_TOKEN is used.
      - name: Pick a seat from the token pool
        id: pick
        env:
          # Only the pool's own tokens, named one by one (GitHub flags workflows
          # that pass toJSON(secrets) to a step as possibly malicious).
          TOK_STERLING: ${{ secrets.CLAUDE_TOKEN_STERLING }}
          TOK_MONGOOSE: ${{ secrets.CLAUDE_TOKEN_MONGOOSE }}
          TOK_ELEPHANT: ${{ secrets.CLAUDE_TOKEN_ELEPHANT }}
          TOK_DOLPHIN: ${{ secrets.CLAUDE_TOKEN_DOLPHIN }}
          TOK_GOSHAWK: ${{ secrets.CLAUDE_TOKEN_GOSHAWK }}
          TOK_HEDGEHOG: ${{ secrets.CLAUDE_TOKEN_HEDGEHOG }}
          TOK_MEERKAT: ${{ secrets.CLAUDE_TOKEN_MEERKAT }}
          TOK_MOOSE: ${{ secrets.CLAUDE_TOKEN_MOOSE }}
          TOK_NEWT: ${{ secrets.CLAUDE_TOKEN_NEWT }}
          TOK_PANTHER: ${{ secrets.CLAUDE_TOKEN_PANTHER }}
          TOK_PARROT: ${{ secrets.CLAUDE_TOKEN_PARROT }}
          TOK_OTTER: ${{ secrets.CLAUDE_TOKEN_OTTER }}
          TOK_FALCON: ${{ secrets.CLAUDE_TOKEN_FALCON }}
          MODEL: ${{ steps.select.outputs.model }}
          SKIP_SEATS: ""
        run: |
          cat > "$RUNNER_TEMP/pick_seat.py" <<'PY'
          import json, os, re, subprocess, tempfile
          from concurrent.futures import ThreadPoolExecutor

          secrets = {"CLAUDE_TOKEN_" + k[4:]: v for k, v in os.environ.items()
                     if k.startswith("TOK_") and v}
          seats = sorted(k[len("CLAUDE_TOKEN_"):] for k in secrets)
          allow = os.environ.get("CLAUDE_TOKEN_POOL", "").split()
          if allow:
              missing = [x for x in allow if x not in seats]
              if missing:
                  print(f"In CLAUDE_TOKEN_POOL but not a secret here: {' '.join(missing)}")
              seats = [x for x in allow if x in seats]
          preferred =[x for x in os.environ.get("CLAUDE_TOKEN_PREFERRED", "").split() if x in seats]
          rest = [x for x in seats if x not in preferred]
          if rest:
              k = int(os.environ.get("GITHUB_RUN_NUMBER", "0")) % len(rest)
              rest = rest[k:] + rest[:k]
          skip = set(os.environ.get("SKIP_SEATS", "").split())
          order = [x for x in preferred + rest if x not in skip]
          model = os.environ.get("MODEL") or "opus"
          base = {k: v for k, v in os.environ.items()
                  if not k.startswith(("TOK_", "ANTHROPIC_", "CLAUDE_CODE_OAUTH"))}

          print(f"{len(seats)} seats in the pool; probing on {model} in this order: {' '.join(order) or '(none)'}")

          # Every seat is probed at once. The one-word probe's stream-json output carries Claude Code's
          # rate_limit_event, with the seat's 5-hour and 7-day utilization, so the pick can prefer seats
          # with headroom instead of taking the first that answers (a seat at 93 % of its 5-hour window
          # once ran out partway through a long run).
          def probe(name):
              env = dict(base, CLAUDE_CODE_OAUTH_TOKEN=secrets["CLAUDE_TOKEN_" + name],
                         CLAUDE_CONFIG_DIR=tempfile.mkdtemp())
              try:
                  p = subprocess.run(["claude", "-p", "Reply with the single word ok.", "--model", model,
                                      "--output-format", "stream-json", "--verbose", "--max-turns", "1"],
                                     env=env, capture_output=True, text=True, timeout=120,
                                     stdin=subprocess.DEVNULL)
              except Exception as exc:
                  return name, None, f"probe failed ({type(exc).__name__})"
              res, use = None, {}
              for line in p.stdout.splitlines():
                  try:
                      m = json.loads(line)
                  except ValueError:
                      continue
                  if m.get("type") == "rate_limit_event":
                      w = (m.get("rate_limit_info") or {}).get("unifiedWindows") or {}
                      use = {k: (w.get(k) or {}).get("utilization") for k in ("five_hour", "seven_day")}
                  elif m.get("type") == "result":
                      res = m
              if res and not res.get("is_error"):
                  return name, use, "ok"
              res = res or {}
              msg = re.sub(r"\s+", " ", str(res.get("result") or res.get("errors") or "no result"))[:160]
              return name, None, f"skipped ({msg})"

          # Tier 0: 5-hour under 50 % and 7-day under 80 %. Tier 1: under 80 % and 95 %. Tier 2: the rest.
          # A seat that reports no usage counts as tier 0, as the old picker treated every seat.
          def tier(use):
              f = float(use.get("five_hour") or 0.0)
              s = float(use.get("seven_day") or 0.0)
              return 0 if (f < 0.5 and s < 0.8) else 1 if (f < 0.8 and s < 0.95) else 2

          with ThreadPoolExecutor(max_workers=8) as ex:
              results = {n: (use, why) for n, use, why in ex.map(probe, order)}
          for n in order:
              use, why = results[n]
              shown = "" if use is None else f" (5-hour {use.get('five_hour')}, 7-day {use.get('seven_day')}, tier {tier(use)})"
              print(f"  {n}: {why}{shown}")

          # The first seat in the rotation order within the best tier, so runs that start together
          # still spread across seats.
          ok = [n for n in order if results[n][1] == "ok"]
          chosen = ""
          if ok:
              best = min(tier(results[n][0]) for n in ok)
              chosen = next(n for n in ok if tier(results[n][0]) == best)
          # The retry skips the chosen seat and the ones that failed, and re-probes the rest.
          tried = ([chosen] if chosen else []) + [n for n in order if results[n][1] != "ok"]

          print(f"Seat for this attempt: {chosen or '(none answered; using CLAUDE_CODE_OAUTH_TOKEN)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"seat={chosen}\n")
              fh.write(f"tried={' '.join(tried)}\n")
          PY
          command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          python3 "$RUNNER_TEMP/pick_seat.py"

      - name: Run Claude Code
        id: claude
        # The job decides what to do with a failure in the next steps, so this
        # one must not end the job by itself.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_TOKEN_{0}', steps.pick.outputs.seat)] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action v1.0.273+ denies python, pip, node and other code-running
          # commands on PRs whose author lacks write access, and treats every bot as such.
          # Lift that only for PRs the Claude app opened (in-repo branches that only
          # writers can push to); everyone else's PRs keep the guard.
          restrict_untrusted_prs: ${{ (github.event.issue.user.login || github.event.pull_request.user.login) == 'claude[bot]' && 'false' || 'true' }}

          # The exact tag found in the trigger text (@claude, @claude+opus-5:max, ...)
          trigger_phrase: ${{ steps.select.outputs.phrase }}

          # The lab's own GitHub App, used by post-queued-comments.yml to post
          # reviewed batches of comments. Listing it here lets an "@claude" in
          # one of those comments start a run. The action strips "[bot]" and
          # ignores case, so this must match the App's slug. Nothing else is
          # allowed: bots on this list bypass the write-permission check.
          allowed_bots: vcl-bot

          # Optional (riskier): Print the full turn-by-turn JSON execution log in the step output
          show_full_output: true

          # Optional (riskier): Render a human-readable "Claude Code Report" in the job's Step Summary
          display_report: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # --model / --effort / --fallback-model chosen by the parse step
          claude_args: |
            ${{ steps.select.outputs.primary_args }}
            --permission-mode bypassPermissions
            --thinking-display summarized

      # Did the first attempt die because its allowance was spent, or for some
      # ordinary reason? A failed run still writes its execution JSON and still
      # sets the execution_file output, and the answer is in the run's own error
      # records: an "api_error" result carrying HTTP 429, and a rate_limit_event
      # whose status is "rejected".
      #
      # Only those error records are searched, never the transcript, so a
      # comment that happens to discuss usage limits cannot trigger a retry.
      #
      # Besides retry/reason, this step emits "note": one line for the next
      # step to append to the first attempt's comment. Empty means the comment
      # is left alone.
      - name: Check whether the model ran out of credits
        id: billing
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          PRIMARY_MODEL_RESOLVED: ${{ steps.select.outputs.model }}
          FALLBACK_MODEL_RESOLVED: ${{ steps.select.outputs.fallback_model }}
          SEAT: ${{ steps.pick.outputs.seat }}
        run: |
          python3 - <<'PY'
          import json, os, re

          path = os.environ.get("EXECUTION_FILE", "")
          primary = os.environ.get("PRIMARY_MODEL_RESOLVED", "") or "the primary model"
          fallback = os.environ.get("FALLBACK_MODEL_RESOLVED", "")
          retry_any = os.environ.get("RETRY_ON_ANY_FAILURE", "false").lower() == "true"

          # The CLI's own wording for a spent allowance, plus the API's
          # credit-balance wording.
          BILLING = re.compile(
              r"out of (usage |extra )?credits|out of extra usage"
              r"|credit balance (is )?too low|(reached|hit) your .{0,40}limit"
              r"|usage limit reached|requires usage credits|out of usage"
              r"|seat type doesn.t include usage|usage allocation has been disabled"
              r"|monthly spend limit",
              re.I,
          )

          # The CLI's wording when a model's safeguards (Fable's classifiers)
          # refuse a request. These fire on ordinary work too, and the model
          # named in the message can't continue, so it is worth one retry on
          # the fallback model.
          SAFEGUARD = re.compile(
              r"safeguards (flagged|stopped)|can.t respond to this message with"
              r"|model_refusal",
              re.I,
          )

          messages = []
          if path and os.path.isfile(path):
              try:
                  messages = json.load(open(path))
              except Exception as exc:
                  print(f"Could not parse {path}: {exc}")
          else:
              print(f"No execution file to inspect (execution_file={path!r})")

          billing = False
          reason = "the failure does not look like a spent allowance"

          for m in messages:
              if m.get("type") == "rate_limit_event":
                  info = m.get("rate_limit_info") or {}
                  if info.get("status") == "rejected":
                      billing = True
                      reason = (
                          f"rate_limit_event rejected: {info.get('rateLimitType')}"
                          f" (overage {info.get('overageStatus')}"
                          f"/{info.get('overageDisabledReason')})"
                      )

          # Safeguard notices the CLI wrote into the run ("... safeguards
          # stopped the response above"). Only non-model records are read.
          flagged = False
          notices = sum(
              1 for m in messages
              if m.get("type") not in ("assistant", "user")
              and SAFEGUARD.search(str(m.get("content", "")))
          )

          results = [m for m in messages if m.get("type") == "result"]
          if results and results[-1].get("is_error"):
              last = results[-1]
              text = " ".join(str(last.get(k, "")) for k in ("result", "errors"))
              status = last.get("api_error_status")
              if status in (402, 429) or BILLING.search(text):
                  billing = True
                  reason = f"HTTP {status}: {last.get('result') or last.get('errors')}"
              elif SAFEGUARD.search(text) or notices:
                  flagged = True
                  reason = f"{primary}'s safeguards flagged the request: {text}"
              # Diagnostics for the log. Only the final error record is
              # printed, and its text only when it reads as an API or CLI
              # error, so a model's own last message never reaches the log.
              looks_like_error = bool(
                  status or text.lstrip().startswith("API Error")
                  or BILLING.search(text) or SAFEGUARD.search(text)
              )
              shown = text if looks_like_error else f"(withheld: {len(text)} characters that don't read as an API error)"
              print(
                  f"Final result record: subtype={last.get('subtype')}"
                  f" api_error_status={status} num_turns={last.get('num_turns')}"
                  f" duration_ms={last.get('duration_ms')}"
              )
              print("Final error text: " + re.sub(r"\s+", " ", shown).strip()[:1000])
          print(f"Safeguard notices in the run: {notices}")

          if not messages:
              reason = "no execution file, so the cause is unknown"

          # A spent allowance belongs to one seat, so with a seat pool the
          # retry can stay on the same model and move to another seat.
          seat = os.environ.get("SEAT", "")
          retry_model = fallback or primary
          retry = (
              (billing and bool(fallback or seat))
              or (flagged and bool(fallback) and fallback != primary)
              or (retry_any and bool(fallback))
          )
          if not fallback and not seat:
              reason += "; no fallback model or seat pool is configured"
          elif retry_any and not billing:
              reason += "; retrying anyway because RETRY_ON_ANY_FAILURE is true"

          if billing and retry:
              where = f"seat {seat} (`{primary}`)" if seat else f"`{primary}`"
              how = " on another seat from the pool" if seat else ""
              note = (f"Out of usage credits on {where}. Retrying with"
                      f" `{retry_model}`{how} in this same job; the retry posts its own"
                      " progress comment in this thread.")
          elif billing:
              note = (f"Out of usage credits for `{primary}`, and there is no"
                      " seat pool or different fallback model, so there is no retry.")
          elif flagged and retry:
              note = (f"`{primary}`'s safeguards flagged this request, which also"
                      f" happens with ordinary work. Retrying with `{retry_model}` in"
                      " this same job; the retry posts its own progress comment in"
                      " this thread.")
          elif flagged:
              note = (f"`{primary}`'s safeguards flagged this request, and there is"
                      " no different fallback model to retry with.")
          elif retry:
              note = (f"The `{primary}` attempt failed with something other"
                      f" than a spent allowance. Retrying with `{fallback}` in"
                      " this same job (RETRY_ON_ANY_FAILURE is on); the retry"
                      " posts its own progress comment in this thread.")
          else:
              note = ""

          reason = re.sub(r"\s+", " ", reason).strip()[:300]
          note = re.sub(r"\s+", " ", note).strip()
          print(f"Allowance spent: {billing}")
          print(f"Safeguards flagged: {flagged}")
          print(f"Retry with {retry_model if retry else '(none)'}: {retry}")
          print(f"Reason: {reason}")
          print(f"Note: {note or '(none)'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"retry={'true' if retry else 'false'}\n")
              fh.write(f"reason={reason}\n")
              fh.write(f"note={note}\n")
              cause = ("when its allowance ran out" if billing else
                       "when the model's safeguards flagged the request" if flagged else
                       "with an error")
              fh.write(f"cause={cause}\n")
          PY

      # The first attempt's comment currently ends at "Claude encountered an
      # error". Append one line saying why and what the job is doing about it,
      # so the thread explains itself while the retry spins up. The comment is
      # found by the run link it carries: at this point only the first attempt
      # has posted a comment holding this run's id. On
      # pull_request_review_comment events the tracking comment is a reply in
      # the review thread, which lives on a different endpoint than issue and
      # PR conversation comments. Editing either needs the write permissions
      # declared at the top of the job.
      - name: Explain the failure on the first attempt's comment
        if: ${{ !cancelled() && steps.billing.outputs.note != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ steps.billing.outputs.note }}
          RUN_MARK: /actions/runs/${{ github.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_review_comment" ]]; then
            number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            list="repos/$GITHUB_REPOSITORY/pulls/$number/comments"
            edit="repos/$GITHUB_REPOSITORY/pulls/comments"
          else
            number=$(jq -r '.issue.number // .pull_request.number' "$GITHUB_EVENT_PATH")
            list="repos/$GITHUB_REPOSITORY/issues/$number/comments"
            edit="repos/$GITHUB_REPOSITORY/issues/comments"
          fi
          comment_id=$(gh api --paginate "$list" \
            --jq '.[] | select(.user.type == "Bot") | select(.body | contains(env.RUN_MARK)) | .id' \
            | head -n1)
          if [[ -z "$comment_id" ]]; then
            echo "No comment from this run found under $list, so there is nothing to annotate."
            exit 0
          fi
          body=$(gh api "$edit/$comment_id" --jq .body)
          printf -v new_body '%s\n\n> [!WARNING]\n> %s' "$body" "$NOTE"
          gh api -X PATCH "$edit/$comment_id" -f body="$new_body" --jq .id >/dev/null
          echo "Annotated comment $comment_id: $NOTE"

      # The retry probes only the seats the first pick had not tried yet.
      - name: Pick another seat for the retry
        id: pick2
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        env:
          # Only the pool's own tokens, named one by one (GitHub flags workflows
          # that pass toJSON(secrets) to a step as possibly malicious).
          TOK_STERLING: ${{ secrets.CLAUDE_TOKEN_STERLING }}
          TOK_MONGOOSE: ${{ secrets.CLAUDE_TOKEN_MONGOOSE }}
          TOK_ELEPHANT: ${{ secrets.CLAUDE_TOKEN_ELEPHANT }}
          TOK_DOLPHIN: ${{ secrets.CLAUDE_TOKEN_DOLPHIN }}
          TOK_GOSHAWK: ${{ secrets.CLAUDE_TOKEN_GOSHAWK }}
          TOK_HEDGEHOG: ${{ secrets.CLAUDE_TOKEN_HEDGEHOG }}
          TOK_MEERKAT: ${{ secrets.CLAUDE_TOKEN_MEERKAT }}
          TOK_MOOSE: ${{ secrets.CLAUDE_TOKEN_MOOSE }}
          TOK_NEWT: ${{ secrets.CLAUDE_TOKEN_NEWT }}
          TOK_PANTHER: ${{ secrets.CLAUDE_TOKEN_PANTHER }}
          TOK_PARROT: ${{ secrets.CLAUDE_TOKEN_PARROT }}
          TOK_OTTER: ${{ secrets.CLAUDE_TOKEN_OTTER }}
          TOK_FALCON: ${{ secrets.CLAUDE_TOKEN_FALCON }}
          MODEL: ${{ steps.select.outputs.fallback_model || steps.select.outputs.model }}
          SKIP_SEATS: ${{ steps.pick.outputs.tried }}
        run: python3 "$RUNNER_TEMP/pick_seat.py"

      # The first attempt left its GitHub App token in origin's URL and
      # revoked it on exit. The retry's branch setup runs `git fetch` before
      # it configures its own auth, so that dead token made every retry die
      # in branch setup ("Invalid username or token"). Point origin back at
      # the plain URL with the job's own token, as actions/checkout does; the
      # retry then replaces this with its own token as usual.
      - name: Reset git auth for the retry
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader || true
          basic=$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"
          git ls-remote --heads origin main >/dev/null && echo "origin reachable with the job token"

          # The first attempt can leave uncommitted files, and the retry's branch
          # setup then can't check out its base ("Your local changes ... would be
          # overwritten by checkout"; byu-finances issue 131, run 45967038494).
          # Keep them in a local commit on a claude/ branch, where the retry's
          # prompt tells it to look, so the tree is clean and nothing is lost.
          if [ -n "$(git status --porcelain)" ]; then
            wip="claude/first-attempt-wip-${GITHUB_RUN_ID}"
            git switch -q -c "$wip"
            git add -A
            git -c user.name="claude[bot]" -c user.email="41898282+claude[bot]@users.noreply.github.com" \
              commit -q --no-verify -m "First attempt's uncommitted changes (run ${GITHUB_RUN_ID}), kept for the retry"
            echo "Kept the first attempt's uncommitted changes on local branch $wip ($(git rev-parse --short HEAD))"
          else
            echo "The first attempt left no uncommitted changes"
          fi

      # The action pins a comment-triggered PR run to the version the commenter
      # saw: it won't start if the branch's latest push is at or after the
      # trigger ("PR #N was updated after the trigger"). If the first attempt
      # pushed to the PR branch before it failed, that check refused the retry,
      # which then did nothing (byu-vcl PR 394, run 45781437965). This step
      # moves the retry's trigger time to just after the first attempt's last
      # push, and only when every push since the trigger was a plain push by
      # the Claude app, chained from the head the trigger saw, the trigger
      # comment wasn't edited, and nobody but a bot has posted in the thread
      # since. Otherwise it changes nothing and the action decides.
      #
      # How: the line where the action takes its trigger time
      # (src/modes/tag/index.ts in the copy the retry runs) is pointed at
      # CLAUDE_RETRY_TRIGGER_TIME, set through GITHUB_ENV. Rewriting the event
      # payload file doesn't work: the runner rewrites event.json before every
      # action step (digital-alloy-lab PR 249, run 45933150247). If the action's
      # line isn't there exactly once, nothing is changed.
      - name: Let the retry build on the first attempt's pushes
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          path = os.environ["GITHUB_EVENT_PATH"]
          ev = json.load(open(path))

          def api(route):
              out = subprocess.run(["gh", "api", route], capture_output=True, text=True, check=True).stdout
              return json.loads(out)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("CLAUDE_RETRY_TRIGGER_TIME=\n")

          def stop(msg):
              print(f"Leaving the trigger time alone: {msg}")
              sys.exit(0)

          def ts(s):
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          if event_name == "issue_comment" and ev.get("issue", {}).get("pull_request"):
              obj, field, number = "comment", "created_at", ev["issue"]["number"]
              comment_route = f"repos/{repo}/issues/comments/{ev['comment']['id']}"
          elif event_name == "pull_request_review_comment":
              obj, field, number = "comment", "created_at", ev["pull_request"]["number"]
              comment_route = f"repos/{repo}/pulls/comments/{ev['comment']['id']}"
          elif event_name == "pull_request_review":
              obj, field, number = "review", "submitted_at", ev["pull_request"]["number"]
              comment_route = None
          else:
              stop("not a comment or review on a PR")

          trigger = ts(ev[obj][field])
          pr = api(f"repos/{repo}/pulls/{number}")
          if pr["state"] != "open":
              stop("the PR is not open")
          if pr["head"]["repo"] is None or pr["head"]["repo"]["full_name"] != repo:
              stop("the PR's branch is not in this repo")
          branch, head = pr["head"]["ref"], pr["head"]["sha"]

          pushes = api(f"repos/{repo}/activity?ref=refs/heads/{branch}&per_page=100")
          if not pushes or pushes[0]["after"] != head:
              stop("the branch's push record doesn't end at the PR head")
          if ts(pushes[0]["timestamp"]) < trigger:
              stop("nothing was pushed after the trigger")

          after = [p for p in pushes if ts(p["timestamp"]) >= trigger]
          before = [p for p in pushes if ts(p["timestamp"]) < trigger]
          if not before:
              stop("no push before the trigger in the record")
          for p in after:
              if p.get("activity_type") != "push" or (p.get("actor") or {}).get("login") != "claude[bot]":
                  stop(f"a push after the trigger was a {p.get('activity_type')} by {(p.get('actor') or {}).get('login')}")
          chain = after + [before[0]]
          for newer, older in zip(chain, chain[1:]):
              if newer["before"] != older["after"]:
                  stop("the pushes after the trigger don't chain from the head the trigger saw")

          if comment_route:
              c = api(comment_route)
              if c["updated_at"] != c["created_at"]:
                  stop("the trigger comment was edited")

          def human_since(items, key):
              return [i for i in items if (i.get("user") or {}).get("type") != "Bot" and i.get(key) and ts(i[key]) >= trigger]

          since = f"since={ev[obj][field]}"
          people = human_since(api(f"repos/{repo}/issues/{number}/comments?{since}&per_page=100"), "created_at")
          people += human_since(api(f"repos/{repo}/pulls/{number}/comments?{since}&per_page=100"), "created_at")
          people += [r for r in human_since(api(f"repos/{repo}/pulls/{number}/reviews?per_page=100"), "submitted_at")
                     if r.get("id") != ev.get("review", {}).get("id")]
          if comment_route:
              people = [p for p in people if p.get("id") != ev["comment"]["id"]]
          if people:
              stop(f"{len(people)} comment(s) or review(s) by people since the trigger")

          new = (ts(pushes[0]["timestamp"]) + datetime.timedelta(seconds=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          src_path = os.path.join(os.path.dirname(os.environ["RUNNER_WORKSPACE"]), "_actions", "anthropics",
                                  "claude-code-action", "v1", "src", "modes", "tag", "index.ts")
          old_line = "const triggerTime = await resolveTriggerTimestamp(context, octokit);"
          new_line = ("const triggerTime = process.env.CLAUDE_RETRY_TRIGGER_TIME || "
                      "(await resolveTriggerTimestamp(context, octokit));")
          if not os.path.isfile(src_path):
              stop(f"the action's source isn't at {src_path}")
          src = open(src_path, encoding="utf-8").read()
          if src.count(old_line) != 1:
              stop("the action's trigger-time line has changed, so the action's own check decides")
          with open(src_path, "w", encoding="utf-8") as fh:
              fh.write(src.replace(old_line, new_line))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"CLAUDE_RETRY_TRIGGER_TIME={new}\n")
          print(f"The first attempt pushed {len(after)} time(s) to {branch} after the trigger "
                f"({before[0]['after'][:7]} -> {head[:7]}), all plain pushes by claude[bot]. "
                f"The retry's trigger time is now {new} (was {trigger:%Y-%m-%dT%H:%M:%SZ}).")
          PY

      # Second attempt, on another seat (and the fallback model, if one is set). This is a fresh session: it posts
      # its own tracking comment and starts the task from the beginning, so the
      # note below tells it to look at what the first attempt already did.
      - name: Run Claude Code on the fallback model
        id: fallback
        if: ${{ !cancelled() && steps.billing.outputs.retry == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_TOKEN_{0}', steps.pick2.outputs.seat)] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action v1.0.273+ denies python, pip, node and other code-running
          # commands on PRs whose author lacks write access, and treats every bot as such.
          # Lift that only for PRs the Claude app opened (in-repo branches that only
          # writers can push to); everyone else's PRs keep the guard.
          restrict_untrusted_prs: ${{ (github.event.issue.user.login || github.event.pull_request.user.login) == 'claude[bot]' && 'false' || 'true' }}
          trigger_phrase: ${{ steps.select.outputs.phrase }}
          # The lab's own GitHub App, used by post-queued-comments.yml to post
          # reviewed batches of comments. Listing it here lets an "@claude" in
          # one of those comments start a run. The action strips "[bot]" and
          # ignores case, so this must match the App's slug. Nothing else is
          # allowed: bots on this list bypass the write-permission check.
          allowed_bots: vcl-bot
          # Without this line, the prompt below would switch the action into
          # automation ("agent") mode: no tracking comment, no thread context,
          # and the note below would become the entire task. track_progress
          # forces tag mode, which posts the tracking comment, reads the task
          # from the comment that triggered the run, and delivers the note
          # below as <custom_instructions>. It must sit HERE, on the step that
          # has prompt:, not on the first attempt, where it is a no-op. Both
          # placements have now failed live once each; see
          # https://github.com/ME-EN-372/me-en-372-machine-design-private/blob/main/docs/claude-yml-model-fallback.md
          track_progress: true
          show_full_output: true
          display_report: true
          additional_permissions: |
            actions: read
          # The two attempts share one workspace, and the generated branch name
          # (claude/issue-N-YYYYMMDD-HHMM) has minute resolution, so a retry
          # that starts in the same minute as the first attempt regenerates the
          # exact branch name the first attempt already created and dies in
          # branch setup ("fatal: a branch named ... already exists") before
          # the model ever runs; the action's collision check only consults
          # the remote (git ls-remote), never the local checkout. A disjoint
          # prefix removes the collision by construction. On an open PR both
          # attempts check out the existing PR branch and this input is
          # ignored. Third live firing; see
          # https://github.com/ME-EN-372/me-en-372-machine-design-private/blob/main/docs/claude-yml-model-fallback.md
          branch_prefix: claude/retry-
          prompt: |
            An earlier attempt at this same task ran on ${{ steps.select.outputs.model }} and stopped ${{ steps.billing.outputs.cause || 'when its allowance ran out' }}. You are the retry, running on ${{ steps.select.outputs.fallback_model || steps.select.outputs.model }} with a different seat. Before you start, check this thread for anything that attempt already posted, and check the claude/ branches left in this checkout (git branch --list 'claude/*') for anything it committed, whether or not it pushed; carry on from there rather than redoing it. Its progress comment is the one above yours that reports an error.
          claude_args: |
            --model ${{ steps.select.outputs.fallback_model || steps.select.outputs.model }}
            --effort ${{ steps.select.outputs.effort }}
            --permission-mode bypassPermissions
            --thinking-display summarized

      # Optional, recommended if you set show_full_output=True. Artifact names
      # have to differ, so the two attempts upload separately.
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Upload fallback execution log
        if: always() && steps.fallback.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log-fallback
          path: ${{ steps.fallback.outputs.execution_file }}

      # continue-on-error above hides the first attempt's failure from the job
      # status, so put it back when nothing succeeded.
      - name: Fail if no attempt succeeded
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' && steps.fallback.outcome != 'success' }}
        env:
          REASON: ${{ steps.billing.outputs.reason }}
          RETRIED: ${{ steps.billing.outputs.retry }}
        run: |
          echo "First attempt (${{ steps.select.outputs.model }}) failed: $REASON"
          if [[ "$RETRIED" == "true" ]]; then
            echo "Retry on ${{ steps.select.outputs.fallback_model || steps.select.outputs.model }} (seat ${{ steps.pick2.outputs.seat || 'CLAUDE_CODE_OAUTH_TOKEN' }}) also failed."
          fi
          exit 1
