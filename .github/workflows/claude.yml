name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Allow long waits (e.g., Edison polling) without hitting a job-level limit
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Copilot-style model selector: @claude+<model>[:<effort>]
      # Examples: @claude, @claude+opus-5, @claude+opus-4.8:max, @claude:high
      # Model part: lowercased, dots -> dashes, "claude-" prefixed if missing.
      # Effort part: low | medium | high | xhigh | max (anything else is ignored).
      # The FULL tag is passed as the action's trigger phrase — required because
      # the action only accepts whitespace/punctuation after the phrase, not "+".
      - name: Parse model selector tag
        id: select
        env:
          TRIGGER_TEXT: ${{ github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          # First tag in the text wins
          TAG=$(grep -oiE '@claude(\+[a-z0-9.-]*[a-z0-9])?(:[a-z]+)?' <<<"$TRIGGER_TEXT" | head -n1)
          TAG=${TAG:-@claude}

          tag_lc=$(tr '[:upper:]' '[:lower:]' <<<"$TAG")
          rest=${tag_lc#@claude}
          effort=""
          if [[ "$rest" == *:* ]]; then
            effort=${rest##*:}
            rest=${rest%:*}
          fi
          model_part=${rest#+}

          if [[ -z "$model_part" ]]; then
            # Default model for a bare @claude mention — edit this line to change it
            model="claude-opus-5"
          elif [[ "$model_part" != *[0-9]* ]]; then
            # Unversioned family name (opus, sonnet, fable, haiku) -> pass through as a
            # CLI alias, which resolves to the latest model of that family
            model=${model_part#claude-}
          else
            model=${model_part//./-}
            [[ "$model" == claude-* ]] || model="claude-$model"
          fi

          args="--model $model"
          case "$effort" in
            low|medium|high|xhigh|max) args="$args --effort $effort" ;;
            "") args="$args --effort max" ;;   # no :effort suffix given -> default to max
            *) echo "Ignoring unknown effort level ':$effort'" ;;
          esac

          echo "Tag: $TAG -> $args"
          echo "phrase=$TAG" >> "$GITHUB_OUTPUT"
          echo "model_args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDISON_PLATFORM_API_KEY: ${{ secrets.EDISON_PLATFORM_API_KEY }}
          TAILNET_ID: ${{ secrets.TAILNET_ID }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          RPI_STREAM_CAM_HOSTNAME: ${{ secrets.RPI_STREAM_CAM_HOSTNAME }}
          RPI_STREAM_CAM_PASSWORD: ${{ secrets.RPI_STREAM_CAM_PASSWORD }}
          RPI_STREAM_CAM_USERNAME: ${{ secrets.RPI_STREAM_CAM_USERNAME }}
          OT2_STREAM_CAM_HOSTNAME: ${{ secrets.OT2_STREAM_CAM_HOSTNAME }}
          OT2_STREAM_CAM_PASSWORD: ${{ secrets.OT2_STREAM_CAM_PASSWORD }}
          OT2_STREAM_CAM_USERNAME: ${{ secrets.OT2_STREAM_CAM_USERNAME }}        
          HEALTHCHECKS_IO_URL: ${{ secrets.HEALTHCHECKS_IO_URL }}
          AIRGRADIENT_API_KEY: ${{ secrets.AIRGRADIENT_API_KEY }}
          ONEDRIVE_EDIT_LINK_PASSWORD: ${{ secrets.ONEDRIVE_EDIT_LINK_PASSWORD }}
          # MongoDB Atlas — org "Vertical Cloud Lab @ BYU", project byu-vcl, cluster alloy.
          # MONGODB_BLINDED_URI keeps the literal <db_password> placeholder, matching the
          # `blinded_connection_string` convention used by the OT-2-LCM Hugging Face Space.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_BLINDED_URI: ${{ secrets.MONGODB_BLINDED_URI }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # HiveMQ Cloud (free Serverless). MQTT_USERNAME/PASSWORD is the `vcl-agent`
          # credential, meant for CI and debugging; the per-device credentials below are
          # separate so any one of them can be rotated without disturbing the others.
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_WEBSOCKET_PORT: ${{ secrets.MQTT_WEBSOCKET_PORT }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_PICOW_USERNAME: ${{ secrets.MQTT_PICOW_USERNAME }}
          MQTT_PICOW_PASSWORD: ${{ secrets.MQTT_PICOW_PASSWORD }}
          MQTT_HF_SPACE_USERNAME: ${{ secrets.MQTT_HF_SPACE_USERNAME }}
          MQTT_HF_SPACE_PASSWORD: ${{ secrets.MQTT_HF_SPACE_PASSWORD }}
          MQTT_OT2_USERNAME: ${{ secrets.MQTT_OT2_USERNAME }}
          MQTT_OT2_PASSWORD: ${{ secrets.MQTT_OT2_PASSWORD }}
          # Hugging Face (byu-vcl account) and Zenodo (deposit:write + deposit:actions)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
          # OT-2 robot serial, read from the robot's own /health endpoint. Namespaces the
          # command/ot2/<serial>/pipette and status/ot2/<serial>/complete MQTT topics.
          OT2_SERIAL: ${{ secrets.OT2_SERIAL }}
          # Allow long-blocking foreground commands (e.g., Edison polling)
          BASH_DEFAULT_TIMEOUT_MS: "900000" # 15 min default per Bash call
          BASH_MAX_TIMEOUT_MS: "3600000" # 60 min ceiling per Bash call
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The exact tag found in the trigger text (@claude, @claude+opus-5:max, ...)
          trigger_phrase: ${{ steps.select.outputs.phrase }}

          # # Optional (riskier): Print the full turn-by-turn JSON execution log in the step output
          # show_full_output: true

          # # Optional (riskier): Render a human-readable "Claude Code Report" in the job's Step Summary
          # display_report: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # --model / --effort chosen by the "Parse model selector tag" step
          claude_args: |
            ${{ steps.select.outputs.model_args }}
            --permission-mode bypassPermissions

      # # Optional, recommended if you set show_full_output=True
      # - name: Upload Claude execution log
      #   if: always() && steps.claude.outputs.execution_file != ''
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: claude-execution-log
      #     path: ${{ steps.claude.outputs.execution_file }}
