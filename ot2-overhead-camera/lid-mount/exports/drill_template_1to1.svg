  <text x="107.95" y="14.00" font-family="Helvetica, Arial, sans-serif" font-size="5.0" text-anchor="middle" font-weight="bold" fill="#000">OT-2 lid camera mount — drill template, ACTUAL SIZE</text>
  <text x="107.95" y="20.50" font-family="Helvetica, Arial, sans-serif" font-size="3.2" text-anchor="middle" font-weight="normal" fill="#000">Print at 100% / “Actual size”, then check both scale bars below before drilling.</text>
  <text x="51.95" y="45.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#c00000">lens cutout (red):</text>
  <text x="51.95" y="49.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#c00000">Ø50.8 mm = 2 in hole saw</text>
  <text x="163.95" y="45.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="end" font-weight="normal" fill="#000">4 × Ø5.0 mm bolt holes</text>
  <text x="163.95" y="49.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="end" font-weight="normal" fill="#000">for M4 screws + nylon washers</text>
  <text x="163.95" y="175.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="end" font-weight="normal" fill="#000">X axis → plate columns 1–12</text>
  <text x="163.95" y="179.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="end" font-weight="normal" fill="#000">(sensor long axis)</text>
  <text x="51.95" y="175.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">▽ = cable side (−Y),</text>
  <text x="51.95" y="179.00" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" font-weight="normal" fill="#000">matches the arrow on the base</text>
  <text x="109.95" y="116.20" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" font-weight="normal" fill="#c00000">pilot / centre punch</text>
