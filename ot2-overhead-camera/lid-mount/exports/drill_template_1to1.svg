  <text x="110.00" y="202.00" font-family="Helvetica, Arial, sans-serif" font-size="3.0" text-anchor="start" font-weight="normal" fill="#0050d0">2 in</text>
  <text x="18.00" y="212.00" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">1. Tape the mount down first and position it with the live preview (preview_server.py) until the plate is</text>
  <text x="23.00" y="217.40" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">centred and square. Trace the base outline and the four tab notches onto the lid with a fine marker.</text>
  <text x="18.00" y="222.80" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">2. Line this sheet (or the printed drill template) up with the tracing and centre-punch the five marks.</text>
  <text x="18.00" y="228.20" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">3. Take the window off (4 screws, slide, lift). Clamp it over a wooden backer board, keep any film on, and</text>
  <text x="23.00" y="233.60" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">use a sharp plastic or step drill at low speed with light pressure; ease off before breaking through.</text>
  <text x="18.00" y="239.00" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">4. Cut the lens hole with a 50.8 mm (2 in) hole saw at low speed; deburr every edge.</text>
  <text x="18.00" y="244.40" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">5. Bolt with M4 button-head screws from inside the robot into the nuts trapped in the base,</text>
  <text x="23.00" y="249.80" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">with a nylon washer under each head: the pipette head passes ~9 mm below the window.</text>
  <text x="23.00" y="255.20" font-family="Helvetica, Arial, sans-serif" font-size="2.9" text-anchor="start" font-weight="normal" fill="#000">Snug only: acrylic cracks from over-tightening and from holes drilled near an edge.</text>
  <text x="107.95" y="269.40" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="middle" font-weight="normal" fill="#666">vertical-cloud-lab/byu-vcl · ot2-overhead-camera/lid-mount · generated by cad/template.py</text>
